<!DOCTYPE html><html><head><meta charset="utf-8"/><title>LP-21 Apple-Inspired Hero</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter',sans-serif;background:#000}
.pg{height:100%;display:flex;flex-direction:column}
.nav{height:48px;background:rgba(0,0,0,.8);backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:center;gap:32px;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0;position:relative;z-index:2}
.nav a{font-size:12px;color:rgba(255,255,255,.65);text-decoration:none;font-weight:400;transition:color .2s}.nav a:hover{color:#fff}.nav .logo{font-size:14px;font-weight:700;color:#fff;letter-spacing:2px}
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:30%;left:50%;transform:translateX(-50%);width:800px;height:800px;border-radius:50%;background:radial-gradient(circle,rgba(88,166,255,.08),transparent 60%);filter:blur(40px)}
.hero h1{font-size:80px;font-weight:800;color:#fff;text-align:center;line-height:1.1;letter-spacing:-1px;position:relative;z-index:1}
.hero h1 span{background:linear-gradient(90deg,#64d2ff,#5e5ce6,#bf5af2);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero .sub{font-size:20px;color:rgba(255,255,255,.45);margin-top:12px;font-weight:400;text-align:center;position:relative;z-index:1}
.hero .dots{display:flex;gap:5px;justify-content:center;margin-top:16px;position:relative;z-index:1}.hero .dots span{width:5px;height:5px;border-radius:50%}
.ctas{display:flex;gap:16px;margin-top:32px;position:relative;z-index:1}
.cta-primary{padding:12px 28px;border-radius:24px;background:#0071e3;color:#fff;font-size:14px;font-weight:500;border:none;cursor:pointer;transition:all .2s}.cta-primary:hover{background:#0077ed}
.cta-secondary{padding:12px 28px;border-radius:24px;background:transparent;color:#2997ff;font-size:14px;font-weight:500;border:none;cursor:pointer}.cta-secondary:hover{text-decoration:underline}
.missions-strip{display:flex;gap:16px;margin-top:48px;position:relative;z-index:1}
.ms{padding:12px 20px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);cursor:pointer;transition:all .2s;text-align:center;min-width:160px}
.ms:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.12)}
.ms h3{font-size:13px;font-weight:600;color:#fff;margin-bottom:2px}.ms p{font-size:10px;color:rgba(255,255,255,.3)}
.foot{padding:12px;text-align:center;font-size:10px;color:rgba(255,255,255,.2);flex-shrink:0}
</style></head><body>
<div class="pg">
<div class="nav"><a class="logo" href="#">MMGIS</a><a href="#">Missions</a><a href="#">Documentation</a><a href="#">About</a><a href="#">Sign In</a></div>
<div class="hero">
<h1>Map <span>any world.</span></h1>
<div class="sub">The Multi-Mission Geographic Information System.</div>
<div class="dots"><span style="background:#fff156"></span><span style="background:#c0822f"></span><span style="background:#ffeaaf"></span><span style="background:#8ab645"></span><span style="background:#ea3a00"></span><span style="background:#edd49e"></span><span style="background:#e7bdcb"></span><span style="background:#72d1cb"></span><span style="background:#08aeea"></span></div>
<div class="ctas"><button class="cta-primary">Get Started</button><button class="cta-secondary">Learn More &rsaquo;</button></div>
<div class="missions-strip">
<div class="ms"><h3>Reference-Mission</h3><p>22 layers &middot; SF Bay Area</p></div>
<div class="ms"><h3>Mars-2020</h3><p>18 layers &middot; Jezero Crater</p></div>
<div class="ms"><h3>Europa-Survey</h3><p>12 layers &middot; Pwyll Crater</p></div>
<div class="ms"><h3>Lunar-Recon</h3><p>15 layers &middot; South Pole</p></div>
</div>
</div>
<div class="foot">NASA/JPL-Caltech &middot; v4.3.27</div>
</div></body></html>
