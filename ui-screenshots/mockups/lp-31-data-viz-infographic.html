<!DOCTYPE html><html><head><meta charset="utf-8"/><title>LP-31 Data Viz Infographic</title>
<style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap');*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:'DM Sans',sans-serif;background:#0c0c14}
.pg{height:100%;display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:auto 1fr auto;gap:1px;background:rgba(255,255,255,.04);padding:1px}
.cell{background:#0c0c14;padding:24px}
/* Header spans all 3 */
.header{grid-column:1/4;display:flex;align-items:center;gap:16px;padding:16px 24px}
.header h1{font-size:24px;font-weight:700;color:#fff;letter-spacing:4px}.header .dots{display:flex;gap:4px}.header .dots span{width:4px;height:4px;border-radius:50%}.header .tag{font-size:11px;color:rgba(255,255,255,.2);margin-left:auto;letter-spacing:2px}
/* Mission cards */
.mc{display:flex;flex-direction:column;cursor:pointer;transition:background .15s}.mc:hover{background:rgba(255,255,255,.02)}
.mc-top{display:flex;align-items:center;gap:10px;margin-bottom:16px}.mc-top .em{font-size:20px}.mc-top h3{font-size:16px;font-weight:600;color:#fff}.mc-top .status{width:6px;height:6px;border-radius:50%;background:#3fb950;margin-left:auto}
.bar-chart{display:flex;gap:3px;align-items:flex-end;height:60px;margin-bottom:12px}
.bar{flex:1;border-radius:2px 2px 0 0;transition:height .3s}
.mc-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mc-stat{text-align:center;padding:8px;border-radius:6px;background:rgba(255,255,255,.02)}.mc-stat .v{font-size:20px;font-weight:700;color:#fff}.mc-stat .l{font-size:9px;color:rgba(255,255,255,.25);text-transform:uppercase;letter-spacing:1px;margin-top:2px}
/* Summary cell */
.summary{display:flex;flex-direction:column;gap:12px}
.sum-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04)}.sum-row .sl{font-size:12px;color:rgba(255,255,255,.4)}.sum-row .sv{font-size:16px;font-weight:600;color:#fff}
.ring-chart{width:100px;height:100px;border-radius:50%;background:conic-gradient(#3fb950 0% 33%,#f0883e 33% 60%,#a371f7 60% 78%,#58a6ff 78% 100%);display:flex;align-items:center;justify-content:center;margin:8px auto}.ring-chart-inner{width:72px;height:72px;border-radius:50%;background:#0c0c14;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#fff}
/* Footer */
.footer{grid-column:1/4;display:flex;align-items:center;gap:16px;padding:8px 24px;font-size:10px;color:rgba(255,255,255,.15)}
</style></head><body>
<div class="pg">
<div class="cell header"><h1>MMGIS</h1><div class="dots"><span style="background:#fff156"></span><span style="background:#c0822f"></span><span style="background:#ffeaaf"></span><span style="background:#8ab645"></span><span style="background:#ea3a00"></span><span style="background:#edd49e"></span><span style="background:#e7bdcb"></span><span style="background:#72d1cb"></span><span style="background:#08aeea"></span></div><span class="tag">LIVE DASHBOARD</span></div>
<div class="cell mc">
<div class="mc-top"><span class="em">&#127758;</span><h3>Reference-Mission</h3><div class="status"></div></div>
<div class="bar-chart"><div class="bar" style="height:40%;background:#3fb950"></div><div class="bar" style="height:65%;background:#3fb950"></div><div class="bar" style="height:80%;background:#3fb950"></div><div class="bar" style="height:55%;background:#3fb950"></div><div class="bar" style="height:90%;background:#3fb950"></div><div class="bar" style="height:70%;background:#3fb950"></div><div class="bar" style="height:45%;background:#3fb950"></div><div class="bar" style="height:85%;background:#3fb950"></div></div>
<div class="mc-stats"><div class="mc-stat"><div class="v">22</div><div class="l">Layers</div></div><div class="mc-stat"><div class="v">14</div><div class="l">Tools</div></div></div>
</div>
<div class="cell mc">
<div class="mc-top"><span class="em">&#127756;</span><h3>Mars-2020</h3><div class="status"></div></div>
<div class="bar-chart"><div class="bar" style="height:70%;background:#f0883e"></div><div class="bar" style="height:45%;background:#f0883e"></div><div class="bar" style="height:55%;background:#f0883e"></div><div class="bar" style="height:80%;background:#f0883e"></div><div class="bar" style="height:35%;background:#f0883e"></div><div class="bar" style="height:60%;background:#f0883e"></div><div class="bar" style="height:75%;background:#f0883e"></div><div class="bar" style="height:50%;background:#f0883e"></div></div>
<div class="mc-stats"><div class="mc-stat"><div class="v">18</div><div class="l">Layers</div></div><div class="mc-stat"><div class="v">12</div><div class="l">Tools</div></div></div>
</div>
<div class="cell summary">
<div class="ring-chart"><div class="ring-chart-inner">67</div></div>
<div class="sum-row"><span class="sl">Total Missions</span><span class="sv">4</span></div>
<div class="sum-row"><span class="sl">Active Layers</span><span class="sv">67</span></div>
<div class="sum-row"><span class="sl">Total Tools</span><span class="sv">44</span></div>
<div class="sum-row"><span class="sl">Data Points</span><span class="sv">3M+</span></div>
</div>
<div class="cell footer">NASA/JPL-Caltech &middot; v4.3.27</div>
</div></body></html>
