<!DOCTYPE html><html><head><meta charset="utf-8"/><title>LP-53 Neumorphism Soft</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter',sans-serif;background:#e0e5ec}
.content{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px}
.logo{text-align:center;margin-bottom:48px}
.logo-circle{width:100px;height:100px;border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;background:#e0e5ec;box-shadow:8px 8px 16px #b8bec7,-8px -8px 16px #ffffff}
.logo-circle h1{font-size:24px;font-weight:700;color:#6b7b8d;letter-spacing:2px}
.logo .dots{display:flex;gap:4px;justify-content:center;margin-top:8px}.logo .dots span{width:4px;height:4px;border-radius:50%}
.logo p{font-size:13px;color:#8a9bae;margin-top:8px}
.search{width:420px;height:48px;border-radius:24px;background:#e0e5ec;box-shadow:inset 4px 4px 8px #b8bec7,inset -4px -4px 8px #ffffff;display:flex;align-items:center;padding:0 20px;gap:8px;margin-bottom:40px}
.search input{flex:1;background:transparent;border:none;outline:none;font-size:13px;color:#6b7b8d;font-family:'Inter',sans-serif}.search input::placeholder{color:#b0bec5}
.cards{display:grid;grid-template-columns:repeat(4,200px);gap:20px}
.card{background:#e0e5ec;border-radius:20px;padding:24px;box-shadow:6px 6px 12px #b8bec7,-6px -6px 12px #ffffff;cursor:pointer;transition:all .2s;text-align:center}
.card:hover{box-shadow:2px 2px 6px #b8bec7,-2px -2px 6px #ffffff}
.card .em{font-size:32px;margin-bottom:12px}.card h3{font-size:14px;font-weight:600;color:#4a5568;margin-bottom:4px}.card p{font-size:11px;color:#a0aec0}
.card .toggle{width:48px;height:24px;border-radius:12px;margin:12px auto 0;background:#e0e5ec;box-shadow:inset 2px 2px 4px #b8bec7,inset -2px -2px 4px #ffffff;position:relative}.card .toggle::after{content:'';width:18px;height:18px;border-radius:50%;background:#6b7b8d;position:absolute;top:3px;left:3px;box-shadow:1px 1px 2px #b8bec7}
.bot{position:absolute;bottom:20px;font-size:10px;color:#b0bec5}
</style></head><body>
<div class="content">
<div class="logo"><div class="logo-circle"><h1>M</h1></div><div class="dots"><span style="background:#fff156"></span><span style="background:#c0822f"></span><span style="background:#ffeaaf"></span><span style="background:#8ab645"></span><span style="background:#ea3a00"></span><span style="background:#edd49e"></span><span style="background:#e7bdcb"></span><span style="background:#72d1cb"></span><span style="background:#08aeea"></span></div><p>MMGIS &mdash; Multi-Mission GIS</p></div>
<div class="search"><span>&#128269;</span><input type="text" placeholder="Search missions..." /></div>
<div class="cards">
<div class="card"><div class="em">&#127758;</div><h3>Reference-Mission</h3><p>22 layers &middot; SF Bay</p><div class="toggle"></div></div>
<div class="card"><div class="em">&#127756;</div><h3>Mars-2020</h3><p>18 layers &middot; Jezero</p><div class="toggle"></div></div>
<div class="card"><div class="em">&#10052;</div><h3>Europa-Survey</h3><p>12 layers &middot; Pwyll</p><div class="toggle"></div></div>
<div class="card"><div class="em">&#127769;</div><h3>Lunar-Recon</h3><p>15 layers &middot; South Pole</p><div class="toggle"></div></div>
</div>
</div>
<div class="bot">NASA/JPL-Caltech &middot; v4.3.27</div>
</body></html>
