<!DOCTYPE html><html><head><meta charset="utf-8"/><title>LP-43 Carousel Slideshow</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter',sans-serif;background:#0a0a0a}
.pg{height:100%;display:flex;flex-direction:column}
.nav{height:56px;display:flex;align-items:center;padding:0 40px;border-bottom:1px solid rgba(255,255,255,.04)}.nav h2{font-size:16px;font-weight:600;color:#fff;letter-spacing:2px}.nav .dots{display:flex;gap:3px;margin-left:8px}.nav .dots span{width:4px;height:4px;border-radius:50%}.nav .right{margin-left:auto;display:flex;gap:16px;align-items:center}.nav .right a{font-size:12px;color:rgba(255,255,255,.4);text-decoration:none}
.main{flex:1;display:flex;align-items:center;padding:0 80px;gap:60px}
.slide-content{flex:1}
.slide-content .num{font-size:120px;font-weight:700;color:rgba(255,255,255,.03);line-height:1}.slide-content h1{font-size:48px;font-weight:700;color:#fff;margin-top:-40px;margin-bottom:12px}.slide-content p{font-size:15px;color:rgba(255,255,255,.35);line-height:1.6;max-width:400px;margin-bottom:24px}.slide-content .stats{display:flex;gap:24px}.slide-content .stat .v{font-size:28px;font-weight:700;color:#fff}.slide-content .stat .l{font-size:10px;color:rgba(255,255,255,.2);text-transform:uppercase;letter-spacing:1px;margin-top:2px}
.slide-content .cta{display:inline-block;padding:12px 28px;border-radius:8px;background:#fff;color:#000;font-size:13px;font-weight:600;margin-top:24px;cursor:pointer}
.slide-preview{width:500px;height:400px;border-radius:16px;background:linear-gradient(135deg,#1a3a2a,#1a2a3a);position:relative;overflow:hidden;flex-shrink:0}
.slide-preview::after{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:40px 40px}
.slide-preview .label{position:absolute;bottom:16px;left:16px;font-size:10px;color:rgba(255,255,255,.2);letter-spacing:2px}
.bottom{height:64px;display:flex;align-items:center;justify-content:center;gap:16px;border-top:1px solid rgba(255,255,255,.04)}
.pager-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.1);cursor:pointer;transition:all .15s}.pager-dot.active{background:#fff;width:24px;border-radius:4px}
.arrows{position:absolute;right:40px;bottom:16px;display:flex;gap:8px}.arr-btn{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.3);cursor:pointer;font-size:14px;background:transparent}
</style></head><body>
<div class="pg">
<div class="nav"><h2>MMGIS</h2><div class="dots"><span style="background:#fff156"></span><span style="background:#c0822f"></span><span style="background:#ffeaaf"></span><span style="background:#8ab645"></span><span style="background:#ea3a00"></span><span style="background:#edd49e"></span><span style="background:#e7bdcb"></span><span style="background:#72d1cb"></span><span style="background:#08aeea"></span></div><div class="right"><a href="#">Docs</a><a href="#">About</a></div></div>
<div class="main">
<div class="slide-content">
<div class="num">01</div>
<h1>Reference-Mission</h1>
<p>San Francisco Bay Area &mdash; comprehensive vector, raster, and 3D layers for reference mapping.</p>
<div class="stats"><div class="stat"><div class="v">22</div><div class="l">Layers</div></div><div class="stat"><div class="v">14</div><div class="l">Tools</div></div><div class="stat"><div class="v">1.2M</div><div class="l">Features</div></div></div>
<div class="cta">Open Mission &rsaquo;</div>
</div>
<div class="slide-preview"><div class="label">MAP PREVIEW</div></div>
</div>
<div class="bottom"><div class="pager-dot active"></div><div class="pager-dot"></div><div class="pager-dot"></div><div class="pager-dot"></div></div>
</div></body></html>
