<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MMGIS Mockup 78: Neobrutalism Bold</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Space Mono',monospace,'Courier New';background:#fffef2;color:#000;height:100vh;overflow:hidden;display:flex;flex-direction:column}
.top{height:48px;background:#ff6b35;display:flex;align-items:center;padding:0 16px;border-bottom:4px solid #000;flex-shrink:0}
.logo{font-size:20px;font-weight:700;color:#000;letter-spacing:2px}
.right{margin-left:auto;display:flex;gap:8px;align-items:center}
.nav-btn{padding:6px 14px;background:#fffef2;border:3px solid #000;font-size:10px;font-weight:700;cursor:pointer;box-shadow:4px 4px 0 #000;text-transform:uppercase;letter-spacing:1px;font-family:inherit}
.nav-btn:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 #000}
.nav-btn.a{background:#ffdd00;color:#000}
.av{width:30px;height:30px;background:#000;color:#fffef2;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:3px solid #000}
.ws{flex:1;display:flex;overflow:hidden}
.sb{width:52px;background:#a0e4cb;border-right:4px solid #000;display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:4px;flex-shrink:0}
.t{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border:3px solid #000;font-size:14px;cursor:pointer;background:#fffef2;box-shadow:3px 3px 0 #000;font-weight:700}
.t:hover{transform:translate(1px,1px);box-shadow:2px 2px 0 #000}
.t.a{background:#ffdd00}
/* Layers panel */
.layers{width:260px;background:#fffef2;border-right:4px solid #000;display:flex;flex-direction:column;flex-shrink:0}
.lh{padding:12px;border-bottom:4px solid #000;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:2px;background:#c3b1e1}
.ll{flex:1;overflow-y:auto;padding:6px}
.li{border:3px solid #000;padding:8px;margin-bottom:4px;display:flex;align-items:center;gap:8px;cursor:pointer;box-shadow:3px 3px 0 #000}
.li:hover{transform:translate(1px,1px);box-shadow:2px 2px 0 #000}
.li.on{background:#a0e4cb}
.li.off{background:#f0f0f0;opacity:.6}
.li-check{width:18px;height:18px;border:3px solid #000;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.li.on .li-check{background:#ffdd00}
.li-name{font-size:10px;font-weight:700;flex:1;text-transform:uppercase;letter-spacing:.5px}
.li-type{padding:2px 6px;border:2px solid #000;font-size:7px;font-weight:700;text-transform:uppercase}
.map{flex:1;background:#fffef2;position:relative;display:flex;align-items:center;justify-content:center}
.ml{font-size:14px;color:#ddd;letter-spacing:6px;text-transform:uppercase;font-weight:700}
.mc{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:4px}
.mb{width:36px;height:36px;background:#fffef2;border:3px solid #000;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;cursor:pointer;box-shadow:3px 3px 0 #000}
.mb:hover{transform:translate(1px,1px);box-shadow:2px 2px 0 #000}
.bb{height:32px;background:#ffdd00;display:flex;align-items:center;padding:0 16px;gap:12px;border-top:4px solid #000;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;flex-shrink:0}
</style>
</head>
<body>
<div class="top"><span class="logo">MMGIS</span><div class="right"><div class="nav-btn a">Map</div><div class="nav-btn">Globe</div><div class="nav-btn">Data</div><div class="av">A</div></div></div>
<div class="ws">
<div class="sb"><div class="t a">&#9776;</div><div class="t">i</div><div class="t">&#9998;</div><div class="t">M</div><div class="t">T</div></div>
<div class="layers"><div class="lh">Layers</div><div class="ll">
<div class="li on"><div class="li-check">&#10003;</div><span class="li-name">XYZ Base Tiles</span><span class="li-type" style="background:#a0e4cb">Tile</span></div>
<div class="li on"><div class="li-check">&#10003;</div><span class="li-name">Points Basic</span><span class="li-type" style="background:#ffdd00">Vec</span></div>
<div class="li on"><div class="li-check">&#10003;</div><span class="li-name">Lines Basic</span><span class="li-type" style="background:#ffdd00">Vec</span></div>
<div class="li off"><div class="li-check"></div><span class="li-name">Polygons Styled</span><span class="li-type">Vec</span></div>
<div class="li on"><div class="li-check">&#10003;</div><span class="li-name">Raster DEM</span><span class="li-type" style="background:#ff6b35;color:#fff">Ras</span></div>
<div class="li off"><div class="li-check"></div><span class="li-name">Traverse Path</span><span class="li-type">Vec</span></div>
<div class="li off"><div class="li-check"></div><span class="li-name">3D Tiles Model</span><span class="li-type" style="background:#c3b1e1">3D</span></div>
</div></div>
<div class="map"><div class="ml">San Francisco Bay</div>
<div class="mc"><div class="mb">+</div><div class="mb">&minus;</div><div class="mb">&#8962;</div></div>
</div></div>
<div class="bb">37.775&deg;N, 122.419&deg;W &bull; Zoom 12 &bull; 4 Layers On &bull; Neobrutalism Theme</div>
</body>
</html>
