<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MMGIS Mockup 30: Fullscreen Map with Overlay Controls</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:#0a0a0a;color:#e5e5e5;height:100vh;overflow:hidden;position:relative}
.map-bg{position:absolute;inset:0;background:linear-gradient(135deg,#1a2332,#0d1b2a,#1b2838);display:flex;align-items:center;justify-content:center}
.ml{font-size:11px;color:#2a3a4a;letter-spacing:4px;text-transform:uppercase}
/* Top floating bar */
.top-bar{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#111827ee;border:1px solid #1f2937;border-radius:12px;padding:6px 10px;display:flex;align-items:center;gap:8px;backdrop-filter:blur(12px)}
.logo{font-size:13px;font-weight:700;color:#60a5fa}
.sep{width:1px;height:20px;background:#374151}
.mission{font-size:10px;color:#9ca3af}
.search{background:#1f2937;border:1px solid #374151;border-radius:8px;padding:5px 10px;font-size:10px;color:#9ca3af;width:180px;font-family:inherit}
.av{width:24px;height:24px;border-radius:50%;background:#60a5fa;color:#111827;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700}
/* Left tool strip */
.tools{position:absolute;left:12px;top:50%;transform:translateY(-50%);background:#111827ee;border:1px solid #1f2937;border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:2px;backdrop-filter:blur(12px)}
.t{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:14px;color:#6b7280;cursor:pointer;transition:all .15s}
.t:hover{background:#1f2937;color:#e5e5e5}
.t.a{background:#1e3a5f;color:#60a5fa}
/* Floating layer panel */
.layer-panel{position:absolute;left:60px;top:60px;width:280px;background:#111827ee;border:1px solid #1f2937;border-radius:14px;backdrop-filter:blur(16px);overflow:hidden}
.lp-header{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1f2937}
.lp-title{font-size:12px;font-weight:600;color:#e5e5e5}
.lp-close{width:20px;height:20px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#6b7280;cursor:pointer}
.lp-close:hover{background:#1f2937}
.lp-search{margin:6px 10px;background:#1f2937;border:1px solid #374151;border-radius:8px;padding:5px 10px;font-size:10px;color:#9ca3af;width:calc(100%-20px);display:block;font-family:inherit}
.lp-content{max-height:300px;overflow-y:auto;padding:4px 6px}
.grp{margin-bottom:2px}
.gh{padding:4px 8px;font-size:10px;font-weight:600;color:#60a5fa;cursor:pointer;display:flex;align-items:center;gap:4px;border-radius:6px}
.gc{font-size:8px;color:#4b5563;margin-left:auto;background:#1f2937;padding:0 5px;border-radius:8px}
.li{padding:3px 8px 3px 16px;display:flex;align-items:center;gap:6px;font-size:10px;color:#d1d5db;border-radius:4px}
.li:hover{background:#1f293766}
.ld{width:3px;height:12px;border-radius:1px}
.tog{width:24px;height:12px;border-radius:6px;background:#374151;position:relative;cursor:pointer;margin-left:auto;flex-shrink:0}
.tog.on{background:#3b82f6}
.tog::after{content:'';position:absolute;width:8px;height:8px;border-radius:50%;background:#6b7280;top:2px;left:2px}
.tog.on::after{left:14px;background:#fff}
/* Right zoom */
.zoom{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:2px}
.zb{width:34px;height:34px;background:#111827ee;border:1px solid #1f2937;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#60a5fa;cursor:pointer;font-size:14px;backdrop-filter:blur(12px)}
/* Bottom floating bar */
.bottom{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:#111827ee;border:1px solid #1f2937;border-radius:12px;padding:8px 16px;display:flex;align-items:center;gap:14px;backdrop-filter:blur(12px)}
.cd{font-family:monospace;color:#60a5fa;font-size:10px}
.inf{font-size:10px;color:#6b7280}
.ts{display:flex;align-items:center;gap:6px;width:300px}
.tl{font-size:8px;color:#4b5563}
.tt{flex:1;height:3px;background:#1f2937;border-radius:2px;position:relative}
.tf{width:55%;height:100%;background:#3b82f6;border-radius:2px}
.th{position:absolute;width:8px;height:8px;border-radius:50%;background:#60a5fa;border:2px solid #111827;top:-2.5px;left:55%}
.play{width:24px;height:24px;border-radius:50%;background:#3b82f6;display:flex;align-items:center;justify-content:center;color:#fff;font-size:8px;cursor:pointer}
/* Mini-map */
.minimap{position:absolute;right:12px;bottom:60px;width:120px;height:80px;background:#0d1b2a;border:1px solid #1f2937;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.minimap-label{font-size:7px;color:#374151;text-transform:uppercase;letter-spacing:1px}
.minimap-box{position:absolute;width:30px;height:20px;border:1px solid #60a5fa55;border-radius:2px;top:30px;left:45px}
</style>
</head>
<body>
<div class="map-bg"><div class="ml">San Francisco Bay Area</div></div>
<div class="top-bar"><div class="logo">MMGIS</div><div class="sep"></div><div class="mission">Reference Mission</div><div class="sep"></div><input class="search" placeholder="&#8984;K Search..." readonly/><div class="av">A</div></div>
<div class="tools"><div class="t a">&#9776;</div><div class="t">&#8505;</div><div class="t">&#9873;</div><div class="t">&#9998;</div><div class="t">&#8676;</div><div class="t">&#8981;</div><div class="t">&#9201;</div><div class="t">&#9737;</div></div>
<div class="layer-panel">
<div class="lp-header"><span class="lp-title">Layers</span><span class="lp-close">&times;</span></div>
<input class="lp-search" placeholder="Filter layers..." readonly/>
<div class="lp-content">
<div class="grp"><div class="gh">&#9660; Vector<span class="gc">5</span></div>
<div class="li"><div class="ld" style="background:#3b82f6"></div>Points Basic<div class="tog on"></div></div>
<div class="li"><div class="ld" style="background:#10b981"></div>Lines Basic<div class="tog on"></div></div>
<div class="li"><div class="ld" style="background:#f59e0b"></div>Polygons<div class="tog"></div></div>
<div class="li"><div class="ld" style="background:#ef4444"></div>Arrows<div class="tog on"></div></div>
<div class="li"><div class="ld" style="background:#8b5cf6"></div>Annotations<div class="tog"></div></div></div>
<div class="grp"><div class="gh">&#9654; Styling<span class="gc">4</span></div></div>
<div class="grp"><div class="gh">&#9654; Behavior<span class="gc">6</span></div></div>
<div class="grp"><div class="gh">&#9654; Geodatasets<span class="gc">5</span></div></div>
</div></div>
<div class="zoom"><div class="zb">+</div><div class="zb">&minus;</div><div class="zb">&#8962;</div></div>
<div class="minimap"><div class="minimap-label">Overview</div><div class="minimap-box"></div></div>
<div class="bottom"><div class="cd">-122.419&deg;, 37.775&deg;</div><div class="inf">Z12</div><div class="play">&#9654;</div><div class="ts"><span class="tl">Jan 01</span><div class="tt"><div class="tf"></div><div class="th"></div></div><span class="tl">Jan 20</span></div></div>
</body>
</html>
