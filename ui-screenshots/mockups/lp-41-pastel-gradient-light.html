<!DOCTYPE html><html><head><meta charset="utf-8"/><title>LP-41 Pastel Gradient Light</title>
<style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap');*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:'DM Sans',sans-serif;background:linear-gradient(135deg,#fce4ec,#e8eaf6,#e0f7fa,#f3e5f5)}
.content{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px}
.logo{text-align:center;margin-bottom:48px}.logo h1{font-size:56px;font-weight:700;color:#37352f;letter-spacing:6px}.logo .dots{display:flex;gap:5px;justify-content:center;margin-top:8px}.logo .dots span{width:5px;height:5px;border-radius:50%}.logo p{font-size:14px;color:#888;margin-top:12px}
.search{width:480px;height:48px;border-radius:24px;background:#fff;box-shadow:0 4px 24px rgba(0,0,0,.06);display:flex;align-items:center;padding:0 20px;gap:12px;margin-bottom:40px}
.search .ic{color:#bbb}.search input{flex:1;border:none;outline:none;font-size:14px;color:#37352f;font-family:'DM Sans',sans-serif}.search input::placeholder{color:#ccc}
.cards{display:grid;grid-template-columns:repeat(4,200px);gap:16px}
.card{background:#fff;border-radius:20px;padding:24px;box-shadow:0 2px 16px rgba(0,0,0,.04);cursor:pointer;transition:all .2s;text-align:center}.card:hover{transform:translateY(-4px);box-shadow:0 8px 32px rgba(0,0,0,.08)}
.card .em{font-size:32px;margin-bottom:12px}.card h3{font-size:15px;font-weight:600;color:#37352f;margin-bottom:4px}.card p{font-size:11px;color:#aaa}.card .stats{margin-top:12px;display:flex;gap:8px;justify-content:center;font-size:10px;color:#888}
.card .stats span{padding:3px 8px;background:#f5f5f5;border-radius:6px}
.bot{position:absolute;bottom:20px;font-size:10px;color:#ccc}
</style></head><body>
<div class="content">
<div class="logo"><h1>MMGIS</h1><div class="dots"><span style="background:#fff156"></span><span style="background:#c0822f"></span><span style="background:#ffeaaf"></span><span style="background:#8ab645"></span><span style="background:#ea3a00"></span><span style="background:#edd49e"></span><span style="background:#e7bdcb"></span><span style="background:#72d1cb"></span><span style="background:#08aeea"></span></div><p>Multi-Mission Geographic Information System</p></div>
<div class="search"><span class="ic">&#128269;</span><input type="text" placeholder="Search missions, layers, or coordinates..." /></div>
<div class="cards">
<div class="card"><div class="em">&#127758;</div><h3>Reference-Mission</h3><p>San Francisco Bay</p><div class="stats"><span>22 layers</span><span>14 tools</span></div></div>
<div class="card"><div class="em">&#127756;</div><h3>Mars-2020</h3><p>Jezero Crater</p><div class="stats"><span>18 layers</span><span>12 tools</span></div></div>
<div class="card"><div class="em">&#10052;</div><h3>Europa-Survey</h3><p>Pwyll Crater</p><div class="stats"><span>12 layers</span><span>8 tools</span></div></div>
<div class="card"><div class="em">&#127769;</div><h3>Lunar-Recon</h3><p>South Pole</p><div class="stats"><span>15 layers</span><span>10 tools</span></div></div>
</div>
</div>
<div class="bot">NASA/JPL-Caltech &middot; v4.3.27</div>
</body></html>
