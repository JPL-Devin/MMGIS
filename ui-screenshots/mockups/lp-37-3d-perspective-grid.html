<!DOCTYPE html><html><head><meta charset="utf-8"/><title>LP-37 3D Perspective Grid</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap');*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Space Grotesk',sans-serif;background:#0a0a12}
.perspective-grid{position:absolute;bottom:0;left:0;right:0;height:50%;background-image:linear-gradient(rgba(100,200,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(100,200,255,.06) 1px,transparent 1px);background-size:60px 60px;transform:perspective(500px) rotateX(65deg);transform-origin:bottom center}
.horizon-glow{position:absolute;top:48%;left:0;right:0;height:4px;background:linear-gradient(90deg,transparent,rgba(100,200,255,.15),rgba(255,100,200,.15),rgba(100,200,255,.15),transparent);filter:blur(2px)}
.sun{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,150,100,.08),transparent 60%);filter:blur(30px)}
.content{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center}
.top-half{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.top-half h1{font-size:72px;font-weight:700;color:#fff;letter-spacing:8px;text-shadow:0 0 40px rgba(100,200,255,.15)}.top-half .dots{display:flex;gap:6px;justify-content:center;margin-top:8px}.top-half .dots span{width:6px;height:6px;border-radius:50%}.top-half p{font-size:14px;color:rgba(255,255,255,.25);margin-top:16px;letter-spacing:3px}
.bottom-half{width:100%;padding:40px 80px;display:flex;justify-content:center;gap:20px}
.mc{padding:20px 28px;border-radius:12px;background:rgba(0,0,0,.4);backdrop-filter:blur(10px);border:1px solid rgba(100,200,255,.08);cursor:pointer;transition:all .2s;min-width:200px}
.mc:hover{border-color:rgba(100,200,255,.2);background:rgba(0,0,0,.6);transform:translateY(-4px)}
.mc h3{font-size:15px;font-weight:600;color:#fff;margin-bottom:4px}.mc p{font-size:11px;color:rgba(255,255,255,.3)}
.bot{padding:16px;font-size:10px;color:rgba(255,255,255,.1)}
</style></head><body>
<div class="perspective-grid"></div><div class="horizon-glow"></div><div class="sun"></div>
<div class="content">
<div class="top-half"><h1>MMGIS</h1><div class="dots"><span style="background:#fff156"></span><span style="background:#c0822f"></span><span style="background:#ffeaaf"></span><span style="background:#8ab645"></span><span style="background:#ea3a00"></span><span style="background:#edd49e"></span><span style="background:#e7bdcb"></span><span style="background:#72d1cb"></span><span style="background:#08aeea"></span></div><p>MULTI-MISSION GEOGRAPHIC INFORMATION SYSTEM</p></div>
<div class="bottom-half">
<div class="mc"><h3>&#127758; Reference-Mission</h3><p>22 layers &middot; SF Bay Area</p></div>
<div class="mc"><h3>&#127756; Mars-2020</h3><p>18 layers &middot; Jezero Crater</p></div>
<div class="mc"><h3>&#10052; Europa-Survey</h3><p>12 layers &middot; Pwyll Crater</p></div>
<div class="mc"><h3>&#127769; Lunar-Recon</h3><p>15 layers &middot; South Pole</p></div>
</div>
<div class="bot">NASA/JPL-Caltech &middot; v4.3.27</div>
</div></body></html>
