<!DOCTYPE html><html><head><meta charset="utf-8"/><title>LP-50 Circular Navigation</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter',sans-serif;background:#0a0a14}
.ring-bg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:600px;height:600px;border-radius:50%;border:1px solid rgba(255,255,255,.03)}
.ring-bg2{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:400px;height:400px;border-radius:50%;border:1px solid rgba(255,255,255,.02)}
.content{position:relative;z-index:1;height:100%;display:flex;align-items:center;justify-content:center}
.center{text-align:center;position:absolute}.center h1{font-size:48px;font-weight:700;color:#fff;letter-spacing:6px}.center .dots{display:flex;gap:5px;justify-content:center;margin-top:8px}.center .dots span{width:5px;height:5px;border-radius:50%}.center p{font-size:11px;color:rgba(255,255,255,.2);margin-top:12px;letter-spacing:2px}
.orbit-item{position:absolute;width:160px;text-align:center;cursor:pointer;transition:all .3s}.orbit-item:hover{transform:scale(1.08)}
.orbit-item .circle{width:64px;height:64px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:24px;transition:all .3s}
.orbit-item h3{font-size:13px;font-weight:600;color:#fff}.orbit-item p{font-size:10px;color:rgba(255,255,255,.25);margin-top:2px}
.oi1{top:12%;left:50%;transform:translateX(-50%)}.oi2{top:50%;right:10%;transform:translateY(-50%)}.oi3{bottom:12%;left:50%;transform:translateX(-50%)}.oi4{top:50%;left:10%;transform:translateY(-50%)}
.c1{background:rgba(63,185,80,.1);border:1px solid rgba(63,185,80,.2)}.c2{background:rgba(240,136,62,.1);border:1px solid rgba(240,136,62,.2)}.c3{background:rgba(163,113,247,.1);border:1px solid rgba(163,113,247,.2)}.c4{background:rgba(88,166,255,.1);border:1px solid rgba(88,166,255,.2)}
.bot{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-size:10px;color:rgba(255,255,255,.1)}
</style></head><body>
<div class="ring-bg"></div><div class="ring-bg2"></div>
<div class="content">
<div class="center"><h1>MMGIS</h1><div class="dots"><span style="background:#fff156"></span><span style="background:#c0822f"></span><span style="background:#ffeaaf"></span><span style="background:#8ab645"></span><span style="background:#ea3a00"></span><span style="background:#edd49e"></span><span style="background:#e7bdcb"></span><span style="background:#72d1cb"></span><span style="background:#08aeea"></span></div><p>SELECT A MISSION</p></div>
<div class="orbit-item oi1"><div class="circle c1">&#127758;</div><h3>Reference-Mission</h3><p>22 layers</p></div>
<div class="orbit-item oi2"><div class="circle c2">&#127756;</div><h3>Mars-2020</h3><p>18 layers</p></div>
<div class="orbit-item oi3"><div class="circle c3">&#10052;</div><h3>Europa-Survey</h3><p>12 layers</p></div>
<div class="orbit-item oi4"><div class="circle c4">&#127769;</div><h3>Lunar-Recon</h3><p>15 layers</p></div>
</div>
<div class="bot">NASA/JPL-Caltech &middot; v4.3.27</div>
</body></html>
