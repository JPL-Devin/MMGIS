<!DOCTYPE html><html><head><meta charset="utf-8"/><title>LP-13 Gradient Mesh Aurora</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter',sans-serif}
.bg{position:absolute;inset:0;background:#050510}
.aurora{position:absolute;width:100%;height:100%}
.a1{position:absolute;top:-20%;left:10%;width:80%;height:60%;background:radial-gradient(ellipse,rgba(0,255,128,.08),transparent 60%);filter:blur(80px);animation:drift1 8s ease-in-out infinite alternate}
.a2{position:absolute;top:20%;left:-10%;width:70%;height:50%;background:radial-gradient(ellipse,rgba(100,100,255,.1),transparent 60%);filter:blur(60px);animation:drift2 10s ease-in-out infinite alternate}
.a3{position:absolute;bottom:-10%;right:0;width:60%;height:50%;background:radial-gradient(ellipse,rgba(200,50,200,.06),transparent 60%);filter:blur(70px);animation:drift1 12s ease-in-out infinite alternate-reverse}
@keyframes drift1{0%{transform:translateX(0)}100%{transform:translateX(40px)}}
@keyframes drift2{0%{transform:translateY(0)}100%{transform:translateY(30px)}}
.stars{position:absolute;inset:0}.star{position:absolute;width:1px;height:1px;background:#fff;border-radius:50%}
.content{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.logo-area{text-align:center;margin-bottom:48px}
.logo-area h1{font-size:72px;font-weight:700;letter-spacing:12px;background:linear-gradient(135deg,#fff 20%,#88ffcc 50%,#8888ff 80%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo-dots{display:flex;gap:6px;justify-content:center;margin-top:8px}.logo-dots span{width:6px;height:6px;border-radius:50%}
.tagline{font-size:15px;color:rgba(255,255,255,.35);margin-top:16px;letter-spacing:3px;font-weight:300}
.missions{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;max-width:900px;width:90%}
.mc{padding:24px;border-radius:16px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);backdrop-filter:blur(20px);cursor:pointer;transition:all .3s;text-align:center}
.mc:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12);transform:translateY(-4px)}
.mc h3{font-size:15px;font-weight:600;color:rgba(255,255,255,.8);margin-bottom:4px}.mc p{font-size:11px;color:rgba(255,255,255,.3)}
.mc .ring{width:48px;height:48px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center}
.bot{position:absolute;bottom:24px;display:flex;gap:24px}.bot span,.bot a{font-size:10px;color:rgba(255,255,255,.15);text-decoration:none}
</style></head><body>
<div class="bg"><div class="aurora"><div class="a1"></div><div class="a2"></div><div class="a3"></div></div>
<div class="stars"><div class="star" style="top:8%;left:15%;opacity:.5"></div><div class="star" style="top:22%;left:45%;opacity:.3"></div><div class="star" style="top:35%;left:78%;opacity:.6"></div><div class="star" style="top:55%;left:25%;opacity:.4"></div><div class="star" style="top:70%;left:65%;opacity:.5"></div><div class="star" style="top:12%;left:88%;opacity:.3"></div><div class="star" style="top:82%;left:40%;opacity:.4"></div><div class="star" style="top:45%;left:55%;opacity:.6"></div></div></div>
<div class="content">
<div class="logo-area">
<h1>MMGIS</h1>
<div class="logo-dots"><span style="background:#fff156"></span><span style="background:#c0822f"></span><span style="background:#ffeaaf"></span><span style="background:#8ab645"></span><span style="background:#ea3a00"></span><span style="background:#edd49e"></span><span style="background:#e7bdcb"></span><span style="background:#72d1cb"></span><span style="background:#08aeea"></span></div>
<div class="tagline">Multi-Mission Geographic Information System</div>
</div>
<div class="missions">
<div class="mc"><div class="ring" style="background:rgba(63,185,80,.1);border:1px solid rgba(63,185,80,.2)"><span style="font-size:20px">&#127758;</span></div><h3>Reference-Mission</h3><p>22 layers &middot; SF Bay Area</p></div>
<div class="mc"><div class="ring" style="background:rgba(240,136,62,.1);border:1px solid rgba(240,136,62,.2)"><span style="font-size:20px">&#127756;</span></div><h3>Mars-2020</h3><p>18 layers &middot; Jezero Crater</p></div>
<div class="mc"><div class="ring" style="background:rgba(163,113,247,.1);border:1px solid rgba(163,113,247,.2)"><span style="font-size:20px">&#10052;</span></div><h3>Europa-Survey</h3><p>12 layers &middot; Pwyll Crater</p></div>
<div class="mc"><div class="ring" style="background:rgba(88,166,255,.1);border:1px solid rgba(88,166,255,.2)"><span style="font-size:20px">&#127769;</span></div><h3>Lunar-Recon</h3><p>15 layers &middot; South Pole</p></div>
</div>
<div class="bot"><span>v4.3.27</span><a href="#">Docs</a><a href="#">Attributions</a><span>NASA/JPL-Caltech</span></div>
</div></body></html>
