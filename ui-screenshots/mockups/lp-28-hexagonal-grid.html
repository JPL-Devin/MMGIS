<!DOCTYPE html><html><head><meta charset="utf-8"/><title>LP-28 Hexagonal Grid</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Outfit',sans-serif;background:#0a0a14}
.hex-bg{position:absolute;inset:0;overflow:hidden;opacity:.15}
.hex-row{display:flex;justify-content:center}.hex-row:nth-child(even){margin-left:46px}
.hex{width:80px;height:92px;clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);background:rgba(255,255,255,.03);margin:2px}
.content{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.logo{text-align:center;margin-bottom:48px}.logo h1{font-size:64px;font-weight:700;color:#fff;letter-spacing:8px}.logo .dots{display:flex;gap:5px;justify-content:center;margin-top:8px}.logo .dots span{width:5px;height:5px;border-radius:50%}.logo p{font-size:13px;color:rgba(255,255,255,.25);margin-top:12px;letter-spacing:2px}
.hexgrid{display:flex;gap:24px;align-items:center}
.hex-card{width:180px;height:200px;clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .3s;position:relative;text-align:center}
.hex-card::before{content:'';position:absolute;inset:0;clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);transition:all .3s}
.hex-card:hover{transform:scale(1.08)}
.h1c{background:linear-gradient(135deg,rgba(63,185,80,.2),rgba(63,185,80,.05))}.h1c:hover{background:linear-gradient(135deg,rgba(63,185,80,.3),rgba(63,185,80,.1))}
.h2c{background:linear-gradient(135deg,rgba(240,136,62,.2),rgba(240,136,62,.05))}.h2c:hover{background:linear-gradient(135deg,rgba(240,136,62,.3),rgba(240,136,62,.1))}
.h3c{background:linear-gradient(135deg,rgba(163,113,247,.2),rgba(163,113,247,.05))}.h3c:hover{background:linear-gradient(135deg,rgba(163,113,247,.3),rgba(163,113,247,.1))}
.h4c{background:linear-gradient(135deg,rgba(88,166,255,.2),rgba(88,166,255,.05))}.h4c:hover{background:linear-gradient(135deg,rgba(88,166,255,.3),rgba(88,166,255,.1))}
.hex-card .em{font-size:28px;margin-bottom:8px}.hex-card h3{font-size:13px;font-weight:600;color:#fff}.hex-card p{font-size:10px;color:rgba(255,255,255,.3);margin-top:2px}
.bot{position:absolute;bottom:24px;font-size:10px;color:rgba(255,255,255,.12)}
</style></head><body>
