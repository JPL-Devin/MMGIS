<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MMGIS Mockup 42: Sunset Gradient Theme</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:#1a0a2e;color:#e8d5f5;height:100vh;overflow:hidden;display:flex;flex-direction:column}
.top{height:42px;background:linear-gradient(90deg,#2d1b4e,#1a0a2e);display:flex;align-items:center;padding:0 16px;border-bottom:1px solid #3d2a5e;flex-shrink:0}
.logo{font-size:15px;font-weight:700;background:linear-gradient(135deg,#f97316,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.mission{color:#7c5e99;font-size:10px;margin-left:12px}
.right{margin-left:auto;display:flex;gap:6px;align-items:center}
.av{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#f97316,#ec4899);color:#fff;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700}
.ws{flex:1;display:flex;overflow:hidden}
.sb{width:44px;background:#2d1b4e;border-right:1px solid #3d2a5e;display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:2px;flex-shrink:0}
.t{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:13px;color:#7c5e99;cursor:pointer}
.t:hover{background:#3d2a5e;color:#e8d5f5}
.t.a{background:linear-gradient(135deg,#f9731622,#ec489922);color:#f97316}
.pnl{width:260px;background:#2d1b4e;border-right:1px solid #3d2a5e;display:flex;flex-direction:column;flex-shrink:0}
.ph{padding:10px 14px;font-size:12px;font-weight:600;color:#e8d5f5;border-bottom:1px solid #3d2a5e}
.ll{flex:1;overflow-y:auto;padding:4px 6px}
.grp{margin-bottom:4px}
.gh{padding:5px 8px;font-size:10px;font-weight:600;color:#f97316;cursor:pointer;display:flex;align-items:center;gap:4px;border-radius:6px}
.gc{font-size:9px;color:#7c5e99;margin-left:auto}
.li{padding:4px 8px 4px 16px;display:flex;align-items:center;gap:6px;font-size:10px;color:#c4a8de;border-radius:4px}
.li:hover{background:#3d2a5e44}
.ld{width:3px;height:14px;border-radius:1px}
.tog{width:26px;height:13px;border-radius:7px;background:#3d2a5e;position:relative;cursor:pointer;margin-left:auto;flex-shrink:0}
.tog.on{background:linear-gradient(90deg,#f97316,#ec4899)}
.tog::after{content:'';position:absolute;width:9px;height:9px;border-radius:50%;background:#7c5e99;top:2px;left:2px}
.tog.on::after{left:15px;background:#fff}
.map{flex:1;background:linear-gradient(135deg,#0d0520,#1a0a2e,#2d1040);position:relative;display:flex;align-items:center;justify-content:center}
.ml{font-size:10px;color:#3d2a5e;letter-spacing:3px;text-transform:uppercase}
.mc{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:2px}
.mb{width:28px;height:28px;background:#2d1b4ecc;border:1px solid #3d2a5e;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#f97316;cursor:pointer;font-size:12px;backdrop-filter:blur(8px)}
.bb{height:34px;background:#2d1b4e;display:flex;align-items:center;padding:0 14px;gap:12px;border-top:1px solid #3d2a5e;font-size:10px;color:#7c5e99;flex-shrink:0}
.cd{font-family:monospace;color:#f97316;font-size:10px}
.ts{flex:1;display:flex;align-items:center;gap:4px}
.tl{font-size:9px;color:#7c5e99}
.tt{flex:1;height:3px;background:#3d2a5e;border-radius:2px;position:relative}
.tf{width:55%;height:100%;background:linear-gradient(90deg,#f97316,#ec4899);border-radius:2px}
.th{position:absolute;width:10px;height:10px;border-radius:50%;background:#f97316;border:2px solid #2d1b4e;top:-3.5px;left:55%}
</style>
</head>
<body>
<div class="top"><div class="logo">MMGIS</div><div class="mission">Reference Mission</div><div class="right"><div class="av">A</div></div></div>
<div class="ws">
<div class="sb"><div class="t a">&#9776;</div><div class="t">&#8505;</div><div class="t">&#9873;</div><div class="t">&#9998;</div><div class="t">&#8676;</div><div class="t">&#8981;</div><div class="t">&#9201;</div><div class="t">&#9737;</div></div>
<div class="pnl"><div class="ph">Layers</div>
<div class="ll">
<div class="grp"><div class="gh">&#9660; Vector Layers<span class="gc">5</span></div>
<div class="li"><div class="ld" style="background:#f97316"></div>Points Basic<div class="tog on"></div></div>
<div class="li"><div class="ld" style="background:#a855f7"></div>Lines Basic<div class="tog on"></div></div>
<div class="li"><div class="ld" style="background:#ec4899"></div>Polygons<div class="tog"></div></div>
<div class="li"><div class="ld" style="background:#ef4444"></div>Arrows<div class="tog on"></div></div>
<div class="li"><div class="ld" style="background:#6366f1"></div>Annotations<div class="tog"></div></div></div>
<div class="grp"><div class="gh">&#9654; Feature Styling<span class="gc">4</span></div></div>
<div class="grp"><div class="gh">&#9654; Behavior<span class="gc">6</span></div></div>
<div class="grp"><div class="gh">&#9654; Geodatasets<span class="gc">5</span></div></div>
</div></div>
<div class="map"><div class="ml">San Francisco Bay</div><div class="mc"><div class="mb">+</div><div class="mb">&minus;</div><div class="mb">&#8962;</div></div></div>
</div>
<div class="bb"><span class="cd">-122.419&deg;, 37.775&deg;</span><span>Z12</span><div class="ts"><span class="tl">Jan 01</span><div class="tt"><div class="tf"></div><div class="th"></div></div><span class="tl">Jan 20</span></div></div>
</body>
</html>
