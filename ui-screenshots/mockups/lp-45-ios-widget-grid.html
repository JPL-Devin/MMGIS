<!DOCTYPE html><html><head><meta charset="utf-8"/><title>LP-45 iOS Widget Grid</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter',sans-serif;background:linear-gradient(180deg,#c9d6ff,#e2e2e2)}
.pg{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px}
.time{font-size:64px;font-weight:200;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.1);margin-bottom:4px}.date{font-size:14px;color:rgba(255,255,255,.7);margin-bottom:32px}
.widgets{display:grid;grid-template-columns:200px 200px 200px;grid-template-rows:auto auto;gap:12px}
.widget{border-radius:20px;padding:16px;backdrop-filter:blur(20px);cursor:pointer;transition:all .2s}.widget:hover{transform:scale(1.02)}
.w-glass{background:rgba(255,255,255,.55);box-shadow:0 2px 12px rgba(0,0,0,.06)}
.w-big{grid-column:1/3;grid-row:1/2;padding:24px;display:flex;align-items:center;gap:16px}
.w-big .info h2{font-size:20px;font-weight:700;color:#1a1a1a;letter-spacing:2px}.w-big .info .dots{display:flex;gap:3px;margin-top:4px}.w-big .info .dots span{width:4px;height:4px;border-radius:50%}.w-big .info p{font-size:11px;color:#888;margin-top:6px}.w-big .icon{font-size:48px}
.w-sm{display:flex;flex-direction:column;justify-content:space-between}
.w-sm .label{font-size:9px;color:#888;text-transform:uppercase;letter-spacing:1px;font-weight:500}.w-sm .val{font-size:28px;font-weight:700;color:#1a1a1a}.w-sm .sub{font-size:10px;color:#aaa}
.w-mission{display:flex;align-items:center;gap:10px}.w-mission .em{font-size:24px}.w-mission h3{font-size:13px;font-weight:600;color:#1a1a1a}.w-mission p{font-size:10px;color:#888;margin-top:1px}
.w-mission-list{display:flex;flex-direction:column;gap:8px}
.bot{margin-top:24px;font-size:10px;color:rgba(255,255,255,.5)}
</style></head><body>
<div class="pg">
<div class="time">9:41</div>
<div class="date">Monday, April 28</div>
<div class="widgets">
<div class="widget w-glass w-big"><span class="icon">&#127758;</span><div class="info"><h2>MMGIS</h2><div class="dots"><span style="background:#fff156"></span><span style="background:#c0822f"></span><span style="background:#ffeaaf"></span><span style="background:#8ab645"></span><span style="background:#ea3a00"></span><span style="background:#edd49e"></span><span style="background:#e7bdcb"></span><span style="background:#72d1cb"></span><span style="background:#08aeea"></span></div><p>Multi-Mission Geographic Information System</p></div></div>
<div class="widget w-glass w-sm"><div class="label">Missions</div><div class="val">4</div><div class="sub">All active</div></div>
<div class="widget w-glass w-sm"><div class="label">Layers</div><div class="val">67</div><div class="sub">Across all missions</div></div>
<div class="widget w-glass w-mission"><div class="em">&#127759;</div><div><h3>Reference-Mission</h3><p>22 layers &middot; SF Bay Area</p></div></div>
<div class="widget w-glass w-mission"><div class="em">&#127756;</div><div><h3>Mars-2020</h3><p>18 layers &middot; Jezero</p></div></div>
<div class="widget w-glass w-mission-list">
<div class="w-mission"><div class="em">&#10052;</div><div><h3>Europa-Survey</h3><p>12 layers</p></div></div>
<div class="w-mission"><div class="em">&#127769;</div><div><h3>Lunar-Recon</h3><p>15 layers</p></div></div>
</div>
</div>
<div class="bot">NASA/JPL-Caltech &middot; v4.3.27</div>
</div></body></html>
