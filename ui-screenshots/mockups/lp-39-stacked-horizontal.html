<!DOCTYPE html><html><head><meta charset="utf-8"/><title>LP-39 Stacked Horizontal</title>
<style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap');*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:'DM Sans',sans-serif;background:#0a0a0a}
.pg{height:100%;display:flex;flex-direction:column}
.header{padding:16px 40px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.04)}.header h1{font-size:20px;font-weight:700;color:#fff;letter-spacing:3px}.header .dots{display:flex;gap:3px}.header .dots span{width:4px;height:4px;border-radius:50%}.header p{font-size:11px;color:rgba(255,255,255,.2);margin-left:auto}
.rows{flex:1;display:flex;flex-direction:column}
.row{flex:1;display:flex;cursor:pointer;transition:all .2s;border-bottom:1px solid rgba(255,255,255,.03)}
.row:hover{background:rgba(255,255,255,.02)}
.row .left{width:120px;display:flex;align-items:center;justify-content:center;font-size:36px;border-right:1px solid rgba(255,255,255,.03)}
.row .mid{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 32px}.row .mid h3{font-size:20px;font-weight:600;color:#fff;margin-bottom:4px}.row .mid p{font-size:12px;color:rgba(255,255,255,.3)}
.row .right{width:300px;display:flex;align-items:center;gap:16px;padding:0 32px;border-left:1px solid rgba(255,255,255,.03)}
.row .stat{text-align:center}.row .stat .v{font-size:24px;font-weight:700;color:#fff}.row .stat .l{font-size:9px;color:rgba(255,255,255,.2);text-transform:uppercase;letter-spacing:1px;margin-top:2px}
.row .preview{width:100px;height:50px;border-radius:8px;flex-shrink:0}
.p1{background:linear-gradient(135deg,#1a3a2a,#1a2a3a)}.p2{background:linear-gradient(135deg,#3a2218,#2a1a0a)}.p3{background:linear-gradient(135deg,#2a2a3a,#1a1a2a)}.p4{background:linear-gradient(135deg,#3a3a3a,#1a1a1a)}
.row .arrow{font-size:20px;color:rgba(255,255,255,.1);margin-left:auto}
</style></head><body>
<div class="pg">
<div class="header"><h1>MMGIS</h1><div class="dots"><span style="background:#fff156"></span><span style="background:#c0822f"></span><span style="background:#ffeaaf"></span><span style="background:#8ab645"></span><span style="background:#ea3a00"></span><span style="background:#edd49e"></span><span style="background:#e7bdcb"></span><span style="background:#72d1cb"></span><span style="background:#08aeea"></span></div><p>v4.3.27 &middot; NASA/JPL-Caltech</p></div>
<div class="rows">
<div class="row"><div class="left">&#127758;</div><div class="mid"><h3>Reference-Mission</h3><p>San Francisco Bay Area</p></div><div class="right"><div class="preview p1"></div><div class="stat"><div class="v">22</div><div class="l">Layers</div></div><div class="stat"><div class="v">14</div><div class="l">Tools</div></div><span class="arrow">&rsaquo;</span></div></div>
<div class="row"><div class="left">&#127756;</div><div class="mid"><h3>Mars-2020</h3><p>Jezero Crater</p></div><div class="right"><div class="preview p2"></div><div class="stat"><div class="v">18</div><div class="l">Layers</div></div><div class="stat"><div class="v">12</div><div class="l">Tools</div></div><span class="arrow">&rsaquo;</span></div></div>
<div class="row"><div class="left">&#10052;</div><div class="mid"><h3>Europa-Survey</h3><p>Pwyll Crater</p></div><div class="right"><div class="preview p3"></div><div class="stat"><div class="v">12</div><div class="l">Layers</div></div><div class="stat"><div class="v">8</div><div class="l">Tools</div></div><span class="arrow">&rsaquo;</span></div></div>
<div class="row"><div class="left">&#127769;</div><div class="mid"><h3>Lunar-Recon</h3><p>South Pole</p></div><div class="right"><div class="preview p4"></div><div class="stat"><div class="v">15</div><div class="l">Layers</div></div><div class="stat"><div class="v">10</div><div class="l">Tools</div></div><span class="arrow">&rsaquo;</span></div></div>
</div></div></body></html>
