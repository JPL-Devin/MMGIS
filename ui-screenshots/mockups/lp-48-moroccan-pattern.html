<!DOCTYPE html><html><head><meta charset="utf-8"/><title>LP-48 Moroccan Pattern</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500&display=swap');*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter',sans-serif;background:#0d1b2a}
.pattern{position:absolute;inset:0;opacity:.04;background-image:url("data:image/svg+xml,%3Csvg width='80' height='80' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M40 0L80 40L40 80L0 40Z' fill='none' stroke='%23fff' stroke-width='.5'/%3E%3Cpath d='M40 10L70 40L40 70L10 40Z' fill='none' stroke='%23fff' stroke-width='.3'/%3E%3Ccircle cx='40' cy='40' r='12' fill='none' stroke='%23fff' stroke-width='.3'/%3E%3C/svg%3E");background-size:80px 80px}
.content{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.logo{text-align:center;margin-bottom:48px}
.logo h1{font-family:'Cormorant Garamond',serif;font-size:72px;font-weight:300;color:#c9a96e;letter-spacing:12px}.logo .dots{display:flex;gap:6px;justify-content:center;margin-top:8px}.logo .dots span{width:5px;height:5px;border-radius:50%}
.logo .ornament{width:200px;height:1px;margin:16px auto;position:relative;background:linear-gradient(90deg,transparent,rgba(201,169,110,.3),transparent)}.logo .ornament::before,.logo .ornament::after{content:'';position:absolute;top:-3px;width:7px;height:7px;border:1px solid rgba(201,169,110,.3);transform:rotate(45deg)}.logo .ornament::before{left:50%;margin-left:-3px}.logo .ornament::after{display:none}
.logo p{font-size:11px;color:rgba(201,169,110,.3);letter-spacing:4px;text-transform:uppercase;margin-top:12px}
.missions{display:flex;gap:20px}
.mc{width:180px;padding:20px;border:1px solid rgba(201,169,110,.1);text-align:center;cursor:pointer;transition:all .2s;position:relative}.mc:hover{border-color:rgba(201,169,110,.3);background:rgba(201,169,110,.02)}
.mc::before{content:'';position:absolute;top:-1px;left:-1px;right:-1px;bottom:-1px;border:1px solid rgba(201,169,110,.05);margin:4px}
.mc .em{font-size:24px;margin-bottom:10px}.mc h3{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:500;color:#c9a96e}.mc p{font-size:10px;color:rgba(201,169,110,.25);margin-top:4px}
.bot{position:absolute;bottom:24px;font-size:9px;color:rgba(201,169,110,.15);letter-spacing:3px}
</style></head><body>
<div class="pattern"></div>
<div class="content">
<div class="logo"><h1>MMGIS</h1><div class="dots"><span style="background:#fff156"></span><span style="background:#c0822f"></span><span style="background:#ffeaaf"></span><span style="background:#8ab645"></span><span style="background:#ea3a00"></span><span style="background:#edd49e"></span><span style="background:#e7bdcb"></span><span style="background:#72d1cb"></span><span style="background:#08aeea"></span></div><div class="ornament"></div><p>Geographic Information System</p></div>
<div class="missions">
<div class="mc"><div class="em">&#127758;</div><h3>Reference</h3><p>22 layers</p></div>
<div class="mc"><div class="em">&#127756;</div><h3>Mars-2020</h3><p>18 layers</p></div>
<div class="mc"><div class="em">&#10052;</div><h3>Europa</h3><p>12 layers</p></div>
<div class="mc"><div class="em">&#127769;</div><h3>Lunar</h3><p>15 layers</p></div>
</div>
</div>
<div class="bot">NASA &middot; JPL-CALTECH</div>
</body></html>
