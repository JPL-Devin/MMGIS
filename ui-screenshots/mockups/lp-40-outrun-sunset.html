<!DOCTYPE html><html><head><meta charset="utf-8"/><title>LP-40 Outrun Sunset</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;900&display=swap');*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Orbitron',sans-serif}
.sky{position:absolute;inset:0;background:linear-gradient(180deg,#0a0015 0%,#1a0030 30%,#ff006e 60%,#ff8a00 75%,#ffda00 90%)}
.sun{position:absolute;bottom:28%;left:50%;transform:translateX(-50%);width:200px;height:200px;border-radius:50%;background:linear-gradient(180deg,#ff006e,#ff8a00,#ffda00);box-shadow:0 0 80px rgba(255,100,0,.3)}
.sun-lines{position:absolute;bottom:28%;left:50%;transform:translateX(-50%);width:200px;height:100px;overflow:hidden}.sun-lines div{height:4px;background:#0a0015;margin-bottom:6px}
.grid{position:absolute;bottom:0;left:0;right:0;height:40%;background-image:linear-gradient(rgba(255,0,100,.15) 1px,transparent 1px),linear-gradient(90deg,rgba(255,0,100,.15) 1px,transparent 1px);background-size:80px 80px;transform:perspective(400px) rotateX(65deg);transform-origin:bottom}
.content{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center}
.top{margin-top:60px;text-align:center}.top h1{font-size:64px;font-weight:900;color:#fff;letter-spacing:8px;text-shadow:0 0 20px rgba(255,0,100,.5),0 0 40px rgba(255,0,100,.3)}.top .dots{display:flex;gap:6px;justify-content:center;margin-top:8px}.top .dots span{width:6px;height:6px;border-radius:50%}.top p{font-size:10px;color:rgba(255,255,255,.3);letter-spacing:4px;margin-top:12px}
.missions{display:flex;gap:16px;margin-top:auto;margin-bottom:80px}
.mc{padding:16px 24px;background:rgba(0,0,0,.4);border:1px solid rgba(255,0,100,.2);cursor:pointer;transition:all .2s;text-align:center}.mc:hover{border-color:rgba(255,0,100,.5);box-shadow:0 0 15px rgba(255,0,100,.15)}
.mc h3{font-size:11px;font-weight:600;color:#ff006e;letter-spacing:2px}.mc p{font-size:8px;color:rgba(255,255,255,.3);margin-top:4px;letter-spacing:1px}
.bot{position:absolute;bottom:16px;font-size:8px;color:rgba(255,255,255,.15);letter-spacing:3px}
</style></head><body>
<div class="sky"></div><div class="sun"></div>
<div class="sun-lines"><div></div><div></div><div></div><div></div><div></div><div></div><div></div></div>
<div class="grid"></div>
<div class="content">
<div class="top"><h1>MMGIS</h1><div class="dots"><span style="background:#fff156"></span><span style="background:#c0822f"></span><span style="background:#ffeaaf"></span><span style="background:#8ab645"></span><span style="background:#ea3a00"></span><span style="background:#edd49e"></span><span style="background:#e7bdcb"></span><span style="background:#72d1cb"></span><span style="background:#08aeea"></span></div><p>MULTI-MISSION GIS</p></div>
<div class="missions">
<div class="mc"><h3>REFERENCE</h3><p>22 LAYERS</p></div>
<div class="mc"><h3>MARS-2020</h3><p>18 LAYERS</p></div>
<div class="mc"><h3>EUROPA</h3><p>12 LAYERS</p></div>
<div class="mc"><h3>LUNAR</h3><p>15 LAYERS</p></div>
</div>
<div class="bot">NASA / JPL-CALTECH</div>
</div></body></html>
