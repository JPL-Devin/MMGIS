<!DOCTYPE html><html><head><meta charset="utf-8"/><title>LP-36 Japanese Zen Light</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Noto+Serif:wght@300;400;500;600&display=swap');*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Noto Serif',serif;background:#f7f5f0}
.circle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:500px;height:500px;border-radius:50%;border:1px solid rgba(0,0,0,.04)}
.circle2{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:350px;height:350px;border-radius:50%;border:1px solid rgba(0,0,0,.03)}
.content{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.logo{text-align:center;margin-bottom:64px}.logo h1{font-size:48px;font-weight:300;color:#2a2420;letter-spacing:12px}.logo .dots{display:flex;gap:5px;justify-content:center;margin-top:8px}.logo .dots span{width:4px;height:4px;border-radius:50%}.logo .line{width:40px;height:1px;background:#2a2420;margin:16px auto}.logo p{font-size:12px;color:#a09080;letter-spacing:4px}
.missions{display:flex;gap:48px}
.mi{text-align:center;cursor:pointer;transition:all .3s;padding:20px}.mi:hover{transform:translateY(-4px)}
.mi .circle-sm{width:72px;height:72px;border-radius:50%;border:1px solid rgba(0,0,0,.08);margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:24px;transition:all .3s}.mi:hover .circle-sm{border-color:rgba(0,0,0,.2)}
.mi h3{font-size:14px;font-weight:400;color:#2a2420;letter-spacing:1px}.mi p{font-size:11px;color:#b0a090;margin-top:4px}
.bot{position:absolute;bottom:24px;font-size:10px;color:#c0b0a0;letter-spacing:2px}
</style></head><body>
<div class="circle"></div><div class="circle2"></div>
<div class="content">
<div class="logo"><h1>MMGIS</h1><div class="dots"><span style="background:#fff156"></span><span style="background:#c0822f"></span><span style="background:#ffeaaf"></span><span style="background:#8ab645"></span><span style="background:#ea3a00"></span><span style="background:#edd49e"></span><span style="background:#e7bdcb"></span><span style="background:#72d1cb"></span><span style="background:#08aeea"></span></div><div class="line"></div><p>GEOGRAPHIC INFORMATION SYSTEM</p></div>
<div class="missions">
<div class="mi"><div class="circle-sm">&#127758;</div><h3>Reference</h3><p>22 layers</p></div>
<div class="mi"><div class="circle-sm">&#127756;</div><h3>Mars</h3><p>18 layers</p></div>
<div class="mi"><div class="circle-sm">&#10052;</div><h3>Europa</h3><p>12 layers</p></div>
<div class="mi"><div class="circle-sm">&#127769;</div><h3>Moon</h3><p>15 layers</p></div>
</div>
</div>
<div class="bot">NASA &middot; JPL-Caltech</div>
</body></html>
