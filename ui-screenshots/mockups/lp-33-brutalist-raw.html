<!DOCTYPE html><html><head><meta charset="utf-8"/><title>LP-33 Brutalist Raw</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Space Mono',monospace;background:#fff}
.pg{height:100%;display:flex;flex-direction:column}
.header{padding:20px 40px;border-bottom:4px solid #000;display:flex;align-items:center;gap:16px}
.header h1{font-size:48px;font-weight:700;color:#000;letter-spacing:2px}.header .dots{display:flex;gap:4px}.header .dots span{width:6px;height:6px;border-radius:0!important}.header .tag{font-size:10px;color:#888;text-transform:uppercase;letter-spacing:3px;margin-left:auto}
.main{flex:1;display:flex}
.col{flex:1;border-right:4px solid #000;padding:32px;display:flex;flex-direction:column;cursor:pointer;transition:background .15s}
.col:last-child{border-right:none}
.col:hover{background:#f0f0f0}
.col .num{font-size:120px;font-weight:700;color:#000;line-height:1;opacity:.1}.col h3{font-size:20px;font-weight:700;color:#000;text-transform:uppercase;margin-top:auto}.col p{font-size:12px;color:#666;margin-top:4px;line-height:1.6}.col .stats{margin-top:8px;font-size:11px;color:#000;font-weight:700}
.footer{padding:12px 40px;border-top:4px solid #000;display:flex;gap:24px;font-size:10px;color:#888;text-transform:uppercase;letter-spacing:2px}
</style></head><body>
<div class="pg">
<div class="header"><h1>MMGIS</h1><div class="dots"><span style="background:#fff156"></span><span style="background:#c0822f"></span><span style="background:#ffeaaf"></span><span style="background:#8ab645"></span><span style="background:#ea3a00"></span><span style="background:#edd49e"></span><span style="background:#e7bdcb"></span><span style="background:#72d1cb"></span><span style="background:#08aeea"></span></div><span class="tag">Multi-Mission GIS</span></div>
<div class="main">
<div class="col"><div class="num">01</div><h3>Reference-Mission</h3><p>San Francisco Bay Area</p><div class="stats">22 LAYERS / 14 TOOLS</div></div>
<div class="col"><div class="num">02</div><h3>Mars-2020</h3><p>Jezero Crater</p><div class="stats">18 LAYERS / 12 TOOLS</div></div>
<div class="col"><div class="num">03</div><h3>Europa-Survey</h3><p>Pwyll Crater</p><div class="stats">12 LAYERS / 8 TOOLS</div></div>
<div class="col"><div class="num">04</div><h3>Lunar-Recon</h3><p>South Pole</p><div class="stats">15 LAYERS / 10 TOOLS</div></div>
</div>
<div class="footer"><span>NASA/JPL-Caltech</span><span>v4.3.27</span><span>Open Source</span></div>
</div></body></html>
