<!DOCTYPE html><html><head><meta charset="utf-8"/><title>LP-34 Gradient Cards Blur</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter',sans-serif;background:#0f0f1a}
.bg-blob{position:absolute;border-radius:50%;filter:blur(120px);opacity:.3}
.b1{width:500px;height:500px;top:-10%;left:20%;background:#4040ff}.b2{width:400px;height:400px;bottom:0;right:10%;background:#ff4080}.b3{width:300px;height:300px;top:40%;left:60%;background:#40ff80}
.content{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px}
.top{text-align:center}.top h1{font-size:56px;font-weight:700;color:#fff;letter-spacing:6px}.top .dots{display:flex;gap:5px;justify-content:center;margin-top:8px}.top .dots span{width:5px;height:5px;border-radius:50%}.top p{font-size:14px;color:rgba(255,255,255,.3);margin-top:12px}
.cards{display:flex;gap:20px}
.card{width:220px;padding:24px;border-radius:20px;cursor:pointer;transition:all .3s;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;inset:0;border-radius:20px;padding:1px;background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.02));-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask-composite:exclude}
.card:hover{transform:translateY(-8px)}
.c1{background:linear-gradient(135deg,rgba(63,185,80,.15),rgba(63,185,80,.02))}.c2{background:linear-gradient(135deg,rgba(240,136,62,.15),rgba(240,136,62,.02))}.c3{background:linear-gradient(135deg,rgba(163,113,247,.15),rgba(163,113,247,.02))}.c4{background:linear-gradient(135deg,rgba(88,166,255,.15),rgba(88,166,255,.02))}
.card .em{font-size:32px;margin-bottom:16px}.card h3{font-size:16px;font-weight:600;color:#fff;margin-bottom:6px}.card p{font-size:11px;color:rgba(255,255,255,.3);line-height:1.5}.card .meta{display:flex;gap:8px;margin-top:12px;font-size:10px;color:rgba(255,255,255,.25)}
.bot{position:absolute;bottom:20px;font-size:10px;color:rgba(255,255,255,.12)}
</style></head><body>
<div class="bg-blob b1"></div><div class="bg-blob b2"></div><div class="bg-blob b3"></div>
<div class="content">
<div class="top"><h1>MMGIS</h1><div class="dots"><span style="background:#fff156"></span><span style="background:#c0822f"></span><span style="background:#ffeaaf"></span><span style="background:#8ab645"></span><span style="background:#ea3a00"></span><span style="background:#edd49e"></span><span style="background:#e7bdcb"></span><span style="background:#72d1cb"></span><span style="background:#08aeea"></span></div><p>Multi-Mission Geographic Information System</p></div>
<div class="cards">
<div class="card c1"><div class="em">&#127758;</div><h3>Reference-Mission</h3><p>San Francisco Bay Area</p><div class="meta"><span>22 layers</span><span>14 tools</span></div></div>
<div class="card c2"><div class="em">&#127756;</div><h3>Mars-2020</h3><p>Jezero Crater</p><div class="meta"><span>18 layers</span><span>12 tools</span></div></div>
<div class="card c3"><div class="em">&#10052;</div><h3>Europa-Survey</h3><p>Pwyll Crater</p><div class="meta"><span>12 layers</span><span>8 tools</span></div></div>
<div class="card c4"><div class="em">&#127769;</div><h3>Lunar-Recon</h3><p>South Pole</p><div class="meta"><span>15 layers</span><span>10 tools</span></div></div>
</div>
</div>
<div class="bot">NASA/JPL-Caltech &middot; v4.3.27</div>
</body></html>
