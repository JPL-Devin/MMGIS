<!DOCTYPE html><html><head><meta charset="utf-8"/><title>LP-54 Stained Glass</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap');*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter',sans-serif;background:#0a0a12}
.mosaic{position:absolute;inset:0;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(6,1fr);gap:2px;opacity:.08}
.tile{border-radius:2px}
.content{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.logo{text-align:center;margin-bottom:48px}.logo h1{font-family:'Cinzel',serif;font-size:56px;font-weight:400;color:#fff;letter-spacing:8px}.logo .dots{display:flex;gap:6px;justify-content:center;margin-top:8px}.logo .dots span{width:5px;height:5px;border-radius:50%}.logo .line{width:80px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);margin:16px auto}.logo p{font-size:11px;color:rgba(255,255,255,.2);letter-spacing:4px}
.missions{display:flex;gap:16px}
.mc{width:180px;height:200px;border-radius:8px;overflow:hidden;cursor:pointer;position:relative;transition:all .3s}.mc:hover{transform:translateY(-4px)}
.mc-bg{position:absolute;inset:0;opacity:.2}.m1{background:linear-gradient(135deg,#3fb950,#1a6e30)}.m2{background:linear-gradient(135deg,#f0883e,#a05020)}.m3{background:linear-gradient(135deg,#a371f7,#6030a0)}.m4{background:linear-gradient(135deg,#58a6ff,#2060a0)}
.mc::after{content:'';position:absolute;inset:0;border:1px solid rgba(255,255,255,.06);border-radius:8px}
.mc .info{position:absolute;bottom:0;left:0;right:0;padding:16px;background:linear-gradient(transparent,rgba(0,0,0,.6))}
.mc .em{font-size:32px;position:absolute;top:16px;left:16px}.mc h3{font-size:14px;font-weight:500;color:#fff}.mc p{font-size:10px;color:rgba(255,255,255,.35);margin-top:2px}
.bot{position:absolute;bottom:20px;font-size:10px;color:rgba(255,255,255,.1)}
</style></head><body>
<div class="mosaic">
<div class="tile" style="background:#3fb950"></div><div class="tile" style="background:#f0883e"></div><div class="tile" style="background:#a371f7"></div><div class="tile" style="background:#58a6ff"></div><div class="tile" style="background:#f0883e"></div><div class="tile" style="background:#3fb950"></div><div class="tile" style="background:#58a6ff"></div><div class="tile" style="background:#a371f7"></div>

<div class="tile" style="background:#f0883e"></div><div class="tile" style="background:#3fb950"></div><div class="tile" style="background:#58a6ff"></div><div class="tile" style="background:#a371f7"></div><div class="tile" style="background:#3fb950"></div><div class="tile" style="background:#f0883e"></div><div class="tile" style="background:#a371f7"></div><div class="tile" style="background:#58a6ff"></div>
<div class="tile" style="background:#a371f7"></div><div class="tile" style="background:#58a6ff"></div><div class="tile" style="background:#f0883e"></div><div class="tile" style="background:#3fb950"></div><div class="tile" style="background:#58a6ff"></div><div class="tile" style="background:#a371f7"></div><div class="tile" style="background:#f0883e"></div><div class="tile" style="background:#3fb950"></div>

<div class="tile" style="background:#58a6ff"></div><div class="tile" style="background:#a371f7"></div><div class="tile" style="background:#3fb950"></div><div class="tile" style="background:#f0883e"></div><div class="tile" style="background:#a371f7"></div><div class="tile" style="background:#58a6ff"></div><div class="tile" style="background:#3fb950"></div><div class="tile" style="background:#f0883e"></div>
</div>
<div class="content">
<div class="logo"><h1>MMGIS</h1><div class="dots"><span style="background:#fff156"></span><span style="background:#c0822f"></span><span style="background:#ffeaaf"></span><span style="background:#8ab645"></span><span style="background:#ea3a00"></span><span style="background:#edd49e"></span><span style="background:#e7bdcb"></span><span style="background:#72d1cb"></span><span style="background:#08aeea"></span></div><div class="line"></div><p>GEOGRAPHIC INFORMATION SYSTEM</p></div>
