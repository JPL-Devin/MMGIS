<!DOCTYPE html><html><head><meta charset="utf-8"/><title>LP-44 Monochrome Photo</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter',sans-serif}
.bg{position:absolute;inset:0;background:linear-gradient(135deg,#2a2a2a,#1a1a1a,#3a3a3a,#2a2a2a);background-size:400% 400%}
.bg::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.7)}
.grain{position:absolute;inset:0;opacity:.03;background-image:url("data:image/svg+xml,%3Csvg width='200' height='200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence baseFrequency='.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='200' height='200' filter='url(%23n)'/%3E%3C/svg%3E");z-index:1}
.content{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.logo h1{font-size:96px;font-weight:800;color:#fff;letter-spacing:12px;line-height:1}.logo .dots{display:flex;gap:6px;justify-content:center;margin-top:8px}.logo .dots span{width:6px;height:6px;border-radius:50%}
.divider{width:60px;height:1px;background:rgba(255,255,255,.2);margin:24px auto}
.sub{font-size:12px;color:rgba(255,255,255,.3);letter-spacing:4px;text-transform:uppercase}
.missions{display:flex;gap:20px;margin-top:48px}
.mc{padding:16px 28px;border:1px solid rgba(255,255,255,.08);cursor:pointer;transition:all .2s;text-align:left}.mc:hover{border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.02)}
.mc h3{font-size:13px;font-weight:600;color:#fff;margin-bottom:2px}.mc p{font-size:10px;color:rgba(255,255,255,.25)}
.bot{position:absolute;bottom:24px;font-size:10px;color:rgba(255,255,255,.1);letter-spacing:3px}
</style></head><body>
<div class="bg"></div><div class="grain"></div>
<div class="content">
<div class="logo"><h1>MMGIS</h1><div class="dots"><span style="background:#fff156"></span><span style="background:#c0822f"></span><span style="background:#ffeaaf"></span><span style="background:#8ab645"></span><span style="background:#ea3a00"></span><span style="background:#edd49e"></span><span style="background:#e7bdcb"></span><span style="background:#72d1cb"></span><span style="background:#08aeea"></span></div></div>
<div class="divider"></div>
<div class="sub">Multi-Mission Geographic Information System</div>
<div class="missions">
<div class="mc"><h3>Reference-Mission</h3><p>22 layers &middot; SF Bay Area</p></div>
<div class="mc"><h3>Mars-2020</h3><p>18 layers &middot; Jezero Crater</p></div>
<div class="mc"><h3>Europa-Survey</h3><p>12 layers &middot; Pwyll Crater</p></div>
<div class="mc"><h3>Lunar-Recon</h3><p>15 layers &middot; South Pole</p></div>
</div>
</div>
<div class="bot">NASA / JPL-CALTECH</div>
</body></html>
