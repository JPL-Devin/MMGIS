<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Bismuth crystal — iridescent staircase geometry -->
  <!-- Stacked rectangular terraces -->
  <rect x="30" y="130" width="140" height="25" rx="2" fill="#546E7A" stroke="#37474F" stroke-width="1" />
  <rect x="40" y="110" width="120" height="25" rx="2" fill="#7E57C2" stroke="#5E35B1" stroke-width="1" />
  <rect x="50" y="90" width="100" height="25" rx="2" fill="#26C6DA" stroke="#00ACC1" stroke-width="1" />
  <rect x="60" y="70" width="80" height="25" rx="2" fill="#FFC107" stroke="#FFA000" stroke-width="1" />
  <rect x="70" y="50" width="60" height="25" rx="2" fill="#EF5350" stroke="#E53935" stroke-width="1" />
  <rect x="80" y="30" width="40" height="25" rx="2" fill="#AB47BC" stroke="#8E24AA" stroke-width="1" />
  <!-- Side terraces (left) -->
  <rect x="15" y="145" width="30" height="20" rx="2" fill="#26C6DA" stroke="#00ACC1" stroke-width="1" opacity="0.8" />
  <rect x="22" y="130" width="22" height="18" rx="2" fill="#EF5350" stroke="#E53935" stroke-width="1" opacity="0.7" />
  <!-- Side terraces (right) -->
  <rect x="155" y="140" width="30" height="22" rx="2" fill="#FFC107" stroke="#FFA000" stroke-width="1" opacity="0.8" />
  <rect x="158" y="122" width="22" height="22" rx="2" fill="#AB47BC" stroke="#8E24AA" stroke-width="1" opacity="0.7" />
  <!-- Iridescent shimmer -->
  <rect x="82" y="32" width="15" height="8" rx="1" fill="white" opacity="0.15" />
  <rect x="72" y="52" width="20" height="6" rx="1" fill="white" opacity="0.1" />
  <!-- Base shadow -->
  <ellipse cx="100" cy="170" rx="75" ry="8" fill="#263238" opacity="0.2" />
</svg>
