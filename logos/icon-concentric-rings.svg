  <circle cx="100" cy="100" r="72" stroke="#E91E63" stroke-width="2" fill="none" opacity="0.45" />
  <circle cx="100" cy="100" r="54" stroke="#E91E63" stroke-width="2.5" fill="none" opacity="0.6" />
  <circle cx="100" cy="100" r="36" stroke="#E91E63" stroke-width="3" fill="none" opacity="0.8" />
  <circle cx="100" cy="100" r="18" fill="#E91E63" />
  <!-- Crosshair lines -->
