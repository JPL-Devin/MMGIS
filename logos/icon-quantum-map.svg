<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Quantum uncertainty / probability cloud as a map concept -->
  <rect width="200" height="200" fill="#0A0A1A" rx="5" />
  <!-- Probability cloud dots — dense in center, sparse at edges -->
  <g fill="#08AEEA">
    <!-- Dense core -->
    <circle cx="98" cy="102" r="2" opacity="0.9" />
    <circle cx="104" cy="96" r="2" opacity="0.85" />
    <circle cx="95" cy="95" r="1.5" opacity="0.8" />
    <circle cx="107" cy="103" r="1.5" opacity="0.8" />
    <circle cx="100" cy="108" r="2" opacity="0.85" />
    <circle cx="92" cy="100" r="1.5" opacity="0.75" />
    <circle cx="102" cy="92" r="1.5" opacity="0.8" />
    <circle cx="108" cy="98" r="1.5" opacity="0.75" />
    <!-- Medium density -->
    <circle cx="85" cy="90" r="1.5" opacity="0.5" />
    <circle cx="115" cy="88" r="1.5" opacity="0.5" />
    <circle cx="88" cy="112" r="1.5" opacity="0.5" />
    <circle cx="118" cy="108" r="1.5" opacity="0.45" />
    <circle cx="78" cy="100" r="1" opacity="0.4" />
    <circle cx="122" cy="95" r="1" opacity="0.4" />
    <circle cx="100" cy="78" r="1" opacity="0.4" />
    <circle cx="95" cy="122" r="1" opacity="0.4" />
    <!-- Sparse outer -->
    <circle cx="65" cy="80" r="1" opacity="0.2" />
    <circle cx="135" cy="75" r="1" opacity="0.2" />
    <circle cx="70" cy="125" r="1" opacity="0.2" />
    <circle cx="140" cy="120" r="1" opacity="0.15" />
    <circle cx="55" cy="100" r="1" opacity="0.1" />
    <circle cx="145" cy="100" r="1" opacity="0.1" />
    <circle cx="100" cy="55" r="1" opacity="0.1" />
    <circle cx="100" cy="145" r="1" opacity="0.1" />
    <circle cx="50" cy="65" r="0.8" opacity="0.08" />
    <circle cx="155" cy="60" r="0.8" opacity="0.08" />
    <circle cx="160" cy="140" r="0.8" opacity="0.06" />
    <circle cx="45" cy="145" r="0.8" opacity="0.06" />
  </g>
  <!-- Measurement crosshair -->
  <line x1="100" y1="30" x2="100" y2="170" stroke="#FFC107" stroke-width="0.5" opacity="0.3" />
  <line x1="30" y1="100" x2="170" y2="100" stroke="#FFC107" stroke-width="0.5" opacity="0.3" />
  <!-- Uncertainty circles -->
  <circle cx="100" cy="100" r="20" stroke="#FFC107" stroke-width="0.5" fill="none" opacity="0.2" stroke-dasharray="3 2" />
  <circle cx="100" cy="100" r="45" stroke="#FFC107" stroke-width="0.5" fill="none" opacity="0.1" stroke-dasharray="3 2" />
</svg>
