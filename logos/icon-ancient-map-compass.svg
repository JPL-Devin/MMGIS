<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Ancient parchment map fragment with compass — treasure map feel -->
  <defs>
    <linearGradient id="am1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5E6C8" />
      <stop offset="100%" stop-color="#E8D5A3" />
    </linearGradient>
  </defs>
  <!-- Parchment background with torn edges -->
  <path d="M15 10 Q20 8 30 12 Q50 6 70 10 Q90 5 110 12 Q130 8 150 10 Q170 6 185 12 L190 15 Q192 30 188 50 Q193 70 190 90 Q194 110 190 130 Q192 150 188 170 Q191 185 185 190 Q170 194 150 190 Q130 195 110 190 Q90 193 70 190 Q50 194 30 190 Q18 192 15 185 Q10 170 13 150 Q8 130 12 110 Q9 90 12 70 Q8 50 12 30 Q9 18 15 10 Z" fill="url(#am1)" stroke="#C9A96E" stroke-width="1.5" />
  <!-- Map lines -->
  <path d="M40 45 Q70 55 100 48 Q130 42 160 52" stroke="#8D6E63" stroke-width="0.8" opacity="0.4" />
  <path d="M45 70 Q80 60 110 72 Q140 80 165 68" stroke="#8D6E63" stroke-width="0.8" opacity="0.3" />
  <!-- Coast line -->
  <path d="M30 100 Q50 90 70 95 Q90 100 100 110 Q110 120 130 115 Q150 108 170 112" stroke="#795548" stroke-width="1.5" fill="none" />
  <!-- Water hatching below coast -->
  <g stroke="#90CAF9" stroke-width="0.5" opacity="0.3">
    <path d="M30 110 Q60 108 90 115 Q120 122 150 118" />
    <path d="M35 120 Q65 118 95 125 Q125 130 155 125" />
    <path d="M40 130 Q70 128 100 135 Q130 138 160 133" />
  </g>
  <!-- Compass rose (small, in corner) -->
  <g transform="translate(150,40)">
    <circle r="18" stroke="#795548" stroke-width="1" fill="none" />
    <path d="M0 -16 L3 -4 L0 -2 L-3 -4 Z" fill="#795548" />
    <path d="M0 16 L3 4 L0 2 L-3 4 Z" fill="#C9A96E" />
    <path d="M16 0 L4 3 L2 0 L4 -3 Z" fill="#C9A96E" />
    <path d="M-16 0 L-4 3 L-2 0 L-4 -3 Z" fill="#C9A96E" />
    <circle r="2" fill="#795548" />
  </g>
  <!-- X marks the spot -->
  <g stroke="#E74C3C" stroke-width="3" stroke-linecap="round">
    <line x1="55" y1="140" x2="75" y2="160" />
    <line x1="75" y1="140" x2="55" y2="160" />
  </g>
  <!-- Dotted path to X -->
  <path d="M140 70 Q130 90 110 110 Q90 130 70 145" stroke="#795548" stroke-width="1" stroke-dasharray="3 3" fill="none" opacity="0.5" />
</svg>
