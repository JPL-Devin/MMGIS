<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Central body -->
  <circle cx="100" cy="100" r="20" fill="#3F51B5" />
  <!-- Orbit paths -->
  <ellipse cx="100" cy="100" rx="80" ry="30" stroke="#3F51B5" stroke-width="1" fill="none" opacity="0.3" transform="rotate(0 100 100)" />
  <ellipse cx="100" cy="100" rx="80" ry="30" stroke="#08AEEA" stroke-width="1" fill="none" opacity="0.3" transform="rotate(60 100 100)" />
  <ellipse cx="100" cy="100" rx="80" ry="30" stroke="#2ECC71" stroke-width="1" fill="none" opacity="0.3" transform="rotate(120 100 100)" />
  <!-- Orbiting dots -->
  <circle cx="180" cy="100" r="7" fill="#3F51B5" />
  <circle cx="60" cy="31" r="7" fill="#08AEEA" />
  <circle cx="60" cy="169" r="7" fill="#2ECC71" />
  <!-- Inner ring -->
  <circle cx="100" cy="100" r="8" fill="white" />
</svg>
