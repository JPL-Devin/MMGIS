<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Constellation pattern -->
  <g stroke="#FFC107" stroke-width="1.5" opacity="0.5">
    <line x1="30" y1="50" x2="80" y2="35" />
    <line x1="80" y1="35" x2="120" y2="70" />
    <line x1="120" y1="70" x2="160" y2="40" />
    <line x1="120" y1="70" x2="100" y2="120" />
    <line x1="100" y1="120" x2="50" y2="130" />
    <line x1="50" y1="130" x2="30" y2="50" />
    <line x1="100" y1="120" x2="140" y2="160" />
    <line x1="140" y1="160" x2="170" y2="140" />
    <line x1="50" y1="130" x2="60" y2="170" />
  </g>
  <!-- Stars -->
  <circle cx="30" cy="50" r="5" fill="#FFC107" />
  <circle cx="80" cy="35" r="4" fill="#FFC107" />
  <circle cx="120" cy="70" r="6" fill="#FFC107" />
  <circle cx="160" cy="40" r="4" fill="#FFC107" />
  <circle cx="100" cy="120" r="5" fill="#FFC107" />
  <circle cx="50" cy="130" r="4" fill="#FFC107" />
  <circle cx="140" cy="160" r="5" fill="#FFC107" />
  <circle cx="170" cy="140" r="3" fill="#FFC107" />
  <circle cx="60" cy="170" r="3" fill="#FFC107" />
  <!-- Faint background stars -->
  <circle cx="15" cy="15" r="1" fill="#FFC107" opacity="0.4" />
  <circle cx="185" cy="90" r="1" fill="#FFC107" opacity="0.4" />
  <circle cx="90" cy="180" r="1" fill="#FFC107" opacity="0.4" />
  <circle cx="170" cy="180" r="1.5" fill="#FFC107" opacity="0.3" />
</svg>
