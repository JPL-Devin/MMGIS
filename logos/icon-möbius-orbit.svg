<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Möbius strip / infinity orbit with planet -->
  <defs>
    <linearGradient id="mob1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6C63FF" />
      <stop offset="50%" stop-color="#08AEEA" />
      <stop offset="100%" stop-color="#6C63FF" />
    </linearGradient>
  </defs>
  <!-- Infinity/möbius path - thick band -->
  <path d="M30 100 C30 55 60 40 80 65 C95 83 95 100 100 100 C105 100 105 83 120 65 C140 40 170 55 170 100 C170 145 140 160 120 135 C105 117 105 100 100 100 C95 100 95 117 80 135 C60 160 30 145 30 100 Z" stroke="url(#mob1)" stroke-width="6" fill="none" />
  <!-- Inner edge for depth -->
  <path d="M42 100 C42 65 65 55 80 72 C90 85 95 98 100 100 C105 102 110 85 120 72 C135 55 158 65 158 100 C158 135 135 145 120 128 C110 115 105 98 100 100 C95 102 90 115 80 128 C65 145 42 135 42 100 Z" stroke="white" stroke-width="1" fill="none" opacity="0.3" />
  <!-- Central planet -->
  <circle cx="100" cy="100" r="10" fill="#6C63FF" />
  <circle cx="100" cy="100" r="5" fill="#08AEEA" />
  <!-- Orbiting moon -->
  <circle cx="170" cy="100" r="5" fill="#FFC107" />
</svg>
