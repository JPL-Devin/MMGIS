<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Atom-like structure -->
  <ellipse cx="100" cy="100" rx="85" ry="35" stroke="#08AEEA" stroke-width="2" fill="none" transform="rotate(0 100 100)" />
  <ellipse cx="100" cy="100" rx="85" ry="35" stroke="#E74C3C" stroke-width="2" fill="none" transform="rotate(60 100 100)" />
  <ellipse cx="100" cy="100" rx="85" ry="35" stroke="#FFC107" stroke-width="2" fill="none" transform="rotate(120 100 100)" />
  <!-- Electrons -->
  <circle cx="185" cy="100" r="5" fill="#08AEEA" />
  <circle cx="57" cy="26" r="5" fill="#E74C3C" />
  <circle cx="57" cy="174" r="5" fill="#FFC107" />
  <!-- Nucleus -->
  <circle cx="100" cy="100" r="12" fill="#1A1A2E" />
  <circle cx="100" cy="100" r="6" fill="#08AEEA" />
</svg>
