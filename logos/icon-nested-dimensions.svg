<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Nested squares rotated — dimensional portal effect -->
  <g transform="translate(100,100)">
    <rect x="-90" y="-90" width="180" height="180" stroke="#E91E63" stroke-width="2" rx="3" />
    <rect x="-75" y="-75" width="150" height="150" stroke="#9C27B0" stroke-width="2" rx="3" transform="rotate(10)" />
    <rect x="-60" y="-60" width="120" height="120" stroke="#673AB7" stroke-width="2" rx="3" transform="rotate(20)" />
    <rect x="-45" y="-45" width="90" height="90" stroke="#3F51B5" stroke-width="2" rx="3" transform="rotate(30)" />
    <rect x="-32" y="-32" width="64" height="64" stroke="#2196F3" stroke-width="2" rx="3" transform="rotate(40)" />
    <rect x="-20" y="-20" width="40" height="40" stroke="#00BCD4" stroke-width="2" rx="3" transform="rotate(50)" />
    <rect x="-10" y="-10" width="20" height="20" stroke="#009688" stroke-width="2" rx="2" transform="rotate(60)" />
  </g>
</svg>
