<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Abstract vertical curtains of light — like data streams or aurora -->
  <rect width="200" height="200" fill="#0D1117" rx="5" />
  <!-- Light curtains with varying widths and colors -->
  <rect x="10" y="15" width="12" height="170" rx="6" fill="#00E5FF" opacity="0.15" />
  <rect x="28" y="25" width="8" height="150" rx="4" fill="#76FF03" opacity="0.2" />
  <rect x="42" y="10" width="14" height="175" rx="7" fill="#00E5FF" opacity="0.25" />
  <rect x="62" y="30" width="10" height="140" rx="5" fill="#E040FB" opacity="0.2" />
  <rect x="78" y="5" width="16" height="185" rx="8" fill="#00E5FF" opacity="0.35" />
  <rect x="100" y="20" width="12" height="160" rx="6" fill="#76FF03" opacity="0.3" />
  <rect x="118" y="8" width="14" height="178" rx="7" fill="#E040FB" opacity="0.25" />
  <rect x="138" y="28" width="10" height="145" rx="5" fill="#00E5FF" opacity="0.2" />
  <rect x="154" y="12" width="16" height="172" rx="8" fill="#76FF03" opacity="0.3" />
  <rect x="176" y="22" width="12" height="155" rx="6" fill="#E040FB" opacity="0.18" />
  <!-- Bright highlights -->
  <rect x="80" y="40" width="12" height="40" rx="6" fill="white" opacity="0.08" />
  <rect x="155" y="50" width="14" height="30" rx="7" fill="white" opacity="0.06" />
</svg>
