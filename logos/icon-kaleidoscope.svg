<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Kaleidoscope / mandala pattern — rotational symmetry -->
  <g transform="translate(100,100)">
    <!-- 12 petals via rotation -->
    <path d="M0 -80 L15 -30 L0 -10 L-15 -30 Z" fill="#E91E63" opacity="0.7" />
    <path d="M0 -80 L15 -30 L0 -10 L-15 -30 Z" fill="#FF5722" opacity="0.7" transform="rotate(30)" />
    <path d="M0 -80 L15 -30 L0 -10 L-15 -30 Z" fill="#FF9800" opacity="0.7" transform="rotate(60)" />
    <path d="M0 -80 L15 -30 L0 -10 L-15 -30 Z" fill="#FFC107" opacity="0.7" transform="rotate(90)" />
    <path d="M0 -80 L15 -30 L0 -10 L-15 -30 Z" fill="#8BC34A" opacity="0.7" transform="rotate(120)" />
    <path d="M0 -80 L15 -30 L0 -10 L-15 -30 Z" fill="#4CAF50" opacity="0.7" transform="rotate(150)" />
    <path d="M0 -80 L15 -30 L0 -10 L-15 -30 Z" fill="#00BCD4" opacity="0.7" transform="rotate(180)" />
    <path d="M0 -80 L15 -30 L0 -10 L-15 -30 Z" fill="#2196F3" opacity="0.7" transform="rotate(210)" />
    <path d="M0 -80 L15 -30 L0 -10 L-15 -30 Z" fill="#3F51B5" opacity="0.7" transform="rotate(240)" />
    <path d="M0 -80 L15 -30 L0 -10 L-15 -30 Z" fill="#673AB7" opacity="0.7" transform="rotate(270)" />
    <path d="M0 -80 L15 -30 L0 -10 L-15 -30 Z" fill="#9C27B0" opacity="0.7" transform="rotate(300)" />
    <path d="M0 -80 L15 -30 L0 -10 L-15 -30 Z" fill="#E91E63" opacity="0.7" transform="rotate(330)" />
    <!-- Inner ring -->
    <circle r="25" fill="white" opacity="0.3" />
    <circle r="12" fill="white" opacity="0.6" />
  </g>
</svg>
