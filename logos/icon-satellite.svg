<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Satellite body -->
  <rect x="80" y="75" width="40" height="50" rx="4" fill="#3F51B5" />
  <!-- Solar panels -->
  <rect x="10" y="82" width="65" height="36" rx="2" fill="#08AEEA" />
  <rect x="125" y="82" width="65" height="36" rx="2" fill="#08AEEA" />
  <!-- Panel lines -->
  <line x1="32" y1="82" x2="32" y2="118" stroke="#1A1A2E" stroke-width="1" />
  <line x1="54" y1="82" x2="54" y2="118" stroke="#1A1A2E" stroke-width="1" />
  <line x1="147" y1="82" x2="147" y2="118" stroke="#1A1A2E" stroke-width="1" />
  <line x1="169" y1="82" x2="169" y2="118" stroke="#1A1A2E" stroke-width="1" />
  <!-- Antenna -->
  <line x1="100" y1="75" x2="100" y2="45" stroke="#3F51B5" stroke-width="2" />
  <circle cx="100" cy="40" r="5" fill="#FF6B35" />
  <!-- Signal waves -->
  <path d="M85 35 Q100 20 115 35" stroke="#FF6B35" stroke-width="1.5" fill="none" />
  <path d="M78 28 Q100 8 122 28" stroke="#FF6B35" stroke-width="1.5" fill="none" opacity="0.6" />
  <!-- Earth curve below -->
  <path d="M20 180 Q100 140 180 180" stroke="#2ECC71" stroke-width="3" fill="none" />
  <path d="M30 190 Q100 155 170 190" stroke="#2ECC71" stroke-width="2" fill="none" opacity="0.5" />
</svg>
