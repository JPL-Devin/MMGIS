<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="gs1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00BCD4" />
      <stop offset="100%" stop-color="#3F51B5" />
    </linearGradient>
  </defs>
  <!-- Outer circle -->
  <circle cx="100" cy="100" r="90" stroke="url(#gs1)" stroke-width="3" fill="none" />
  <!-- Horizontal grid lines -->
  <ellipse cx="100" cy="40" rx="65" ry="8" stroke="#00BCD4" stroke-width="1.5" fill="none" />
  <ellipse cx="100" cy="70" rx="82" ry="8" stroke="#00BCD4" stroke-width="1.5" fill="none" />
  <line x1="10" y1="100" x2="190" y2="100" stroke="#00BCD4" stroke-width="1.5" />
  <ellipse cx="100" cy="130" rx="82" ry="8" stroke="#00BCD4" stroke-width="1.5" fill="none" />
  <ellipse cx="100" cy="160" rx="65" ry="8" stroke="#00BCD4" stroke-width="1.5" fill="none" />
  <!-- Vertical meridians -->
  <ellipse cx="100" cy="100" rx="20" ry="90" stroke="#3F51B5" stroke-width="1.5" fill="none" />
  <ellipse cx="100" cy="100" rx="50" ry="90" stroke="#3F51B5" stroke-width="1.5" fill="none" />
  <ellipse cx="100" cy="100" rx="75" ry="90" stroke="#3F51B5" stroke-width="1.5" fill="none" />
</svg>
