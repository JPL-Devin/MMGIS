<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Wormhole tunnel — spiraling depth illusion -->
  <circle cx="100" cy="100" r="95" fill="#0D0D1A" />
  <ellipse cx="100" cy="100" rx="90" ry="85" stroke="#6C63FF" stroke-width="1.5" fill="none" opacity="0.15" />
  <ellipse cx="100" cy="100" rx="78" ry="72" stroke="#08AEEA" stroke-width="1.5" fill="none" opacity="0.2" />
  <ellipse cx="100" cy="100" rx="65" ry="58" stroke="#6C63FF" stroke-width="1.5" fill="none" opacity="0.3" transform="rotate(15 100 100)" />
  <ellipse cx="100" cy="100" rx="52" ry="44" stroke="#08AEEA" stroke-width="2" fill="none" opacity="0.4" transform="rotate(30 100 100)" />
  <ellipse cx="100" cy="100" rx="40" ry="32" stroke="#6C63FF" stroke-width="2" fill="none" opacity="0.5" transform="rotate(45 100 100)" />
  <ellipse cx="100" cy="100" rx="28" ry="20" stroke="#08AEEA" stroke-width="2" fill="none" opacity="0.65" transform="rotate(60 100 100)" />
  <ellipse cx="100" cy="100" rx="16" ry="10" stroke="#6C63FF" stroke-width="2" fill="none" opacity="0.8" transform="rotate(75 100 100)" />
  <!-- Bright center -->
  <ellipse cx="100" cy="100" rx="8" ry="4" fill="white" opacity="0.9" transform="rotate(85 100 100)" />
  <!-- Scattered light particles -->
  <circle cx="45" cy="50" r="1.5" fill="#08AEEA" opacity="0.4" />
  <circle cx="155" cy="60" r="1" fill="#6C63FF" opacity="0.5" />
  <circle cx="60" cy="150" r="1" fill="#08AEEA" opacity="0.3" />
  <circle cx="140" cy="145" r="1.5" fill="#6C63FF" opacity="0.4" />
</svg>
