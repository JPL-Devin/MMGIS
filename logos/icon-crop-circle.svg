<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Crop circle pattern viewed from above — alien geometry on terrain -->
  <rect width="200" height="200" fill="#7CB342" rx="5" />
  <!-- Wheat/grass texture lines -->
  <g stroke="#689F38" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="0" x2="200" y2="200" /><line x1="20" y1="0" x2="200" y2="180" />
    <line x1="40" y1="0" x2="200" y2="160" /><line x1="0" y1="20" x2="180" y2="200" />
    <line x1="0" y1="40" x2="160" y2="200" />
  </g>
  <!-- Crop circle design — flattened areas -->
  <circle cx="100" cy="100" r="70" fill="#8BC34A" stroke="#689F38" stroke-width="1" />
  <circle cx="100" cy="100" r="50" fill="#7CB342" stroke="#689F38" stroke-width="1" />
  <circle cx="100" cy="100" r="25" fill="#8BC34A" stroke="#689F38" stroke-width="1" />
  <!-- Satellite circles -->
  <circle cx="100" cy="40" r="15" fill="#8BC34A" stroke="#689F38" stroke-width="1" />
  <circle cx="160" cy="100" r="12" fill="#8BC34A" stroke="#689F38" stroke-width="1" />
  <circle cx="100" cy="160" r="15" fill="#8BC34A" stroke="#689F38" stroke-width="1" />
  <circle cx="40" cy="100" r="12" fill="#8BC34A" stroke="#689F38" stroke-width="1" />
  <!-- Connecting lines (flattened paths) -->
  <line x1="100" y1="55" x2="100" y2="75" stroke="#689F38" stroke-width="8" />
  <line x1="112" y1="100" x2="148" y2="100" stroke="#689F38" stroke-width="6" />
  <line x1="100" y1="125" x2="100" y2="145" stroke="#689F38" stroke-width="8" />
  <line x1="52" y1="100" x2="88" y2="100" stroke="#689F38" stroke-width="6" />
  <!-- Center point -->
  <circle cx="100" cy="100" r="5" fill="#558B2F" />
</svg>
