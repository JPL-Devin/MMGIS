<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Planet breaking apart - dramatic composition -->
  <defs>
    <linearGradient id="sp1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B35" />
      <stop offset="100%" stop-color="#E74C3C" />
    </linearGradient>
  </defs>
  <!-- Left half -->
  <path d="M100 12 C50 12 10 52 10 102 C10 152 50 192 100 192 L100 105 L85 100 L100 95 Z" fill="url(#sp1)" />
  <!-- Right half (offset) -->
  <path d="M108 8 C155 10 195 50 195 98 C195 148 157 186 110 188 L110 105 L125 100 L110 95 Z" fill="url(#sp1)" opacity="0.8" />
  <!-- Crack/gap glow -->
  <line x1="100" y1="12" x2="100" y2="95" stroke="#FFC107" stroke-width="3" opacity="0.6" />
  <line x1="100" y1="105" x2="100" y2="192" stroke="#FFC107" stroke-width="3" opacity="0.6" />
  <line x1="110" y1="8" x2="110" y2="95" stroke="#FFC107" stroke-width="3" opacity="0.6" />
  <line x1="110" y1="105" x2="110" y2="188" stroke="#FFC107" stroke-width="3" opacity="0.6" />
  <!-- Core glow -->
  <circle cx="105" cy="100" r="15" fill="#FFC107" opacity="0.4" />
  <circle cx="105" cy="100" r="8" fill="#FFC107" opacity="0.7" />
  <!-- Debris particles -->
  <circle cx="70" cy="30" r="3" fill="#FF6B35" opacity="0.5" />
  <circle cx="140" cy="40" r="2" fill="#E74C3C" opacity="0.4" />
  <circle cx="55" cy="160" r="2.5" fill="#FF6B35" opacity="0.4" />
  <circle cx="155" cy="155" r="2" fill="#E74C3C" opacity="0.3" />
</svg>
