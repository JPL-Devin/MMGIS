  <line x1="30" y1="170" x2="180" y2="170" stroke="#2C3E50" stroke-width="2" />
  <line x1="30" y1="170" x2="30" y2="20" stroke="#2C3E50" stroke-width="2" />
  <!-- Bars -->
  <rect x="42" y="110" width="20" height="60" rx="2" fill="#08AEEA" />
  <rect x="72" y="70" width="20" height="100" rx="2" fill="#6C63FF" />
  <rect x="102" y="45" width="20" height="125" rx="2" fill="#08AEEA" />
  <rect x="132" y="85" width="20" height="85" rx="2" fill="#6C63FF" />
  <rect x="162" y="30" width="20" height="140" rx="2" fill="#08AEEA" />
  <!-- Trend line -->
  <path d="M52 105 L82 65 L112 40 L142 80 L172 25" stroke="#E74C3C" stroke-width="2" fill="none" stroke-linecap="round" />
