<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- GPS location marker with accuracy circle -->
  <circle cx="100" cy="100" r="80" stroke="#4CAF50" stroke-width="1" fill="#4CAF50" opacity="0.08" />
  <circle cx="100" cy="100" r="55" stroke="#4CAF50" stroke-width="1" fill="#4CAF50" opacity="0.1" />
  <circle cx="100" cy="100" r="30" stroke="#4CAF50" stroke-width="1.5" fill="#4CAF50" opacity="0.15" />
  <!-- Crosshair -->
  <line x1="100" y1="60" x2="100" y2="140" stroke="#4CAF50" stroke-width="2" />
  <line x1="60" y1="100" x2="140" y2="100" stroke="#4CAF50" stroke-width="2" />
  <!-- Center dot -->
  <circle cx="100" cy="100" r="8" fill="#4CAF50" />
  <circle cx="100" cy="100" r="4" fill="white" />
</svg>
