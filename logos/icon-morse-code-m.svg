<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- "M" in Morse code (dash-dash) arranged as a visual element -->
  <!-- M = -- (two dashes) -->
  <rect width="200" height="200" fill="#1A1A2E" rx="8" />
  <!-- Large decorative Morse dashes -->
  <rect x="20" y="85" width="70" height="30" rx="15" fill="#08AEEA" />
  <rect x="110" y="85" width="70" height="30" rx="15" fill="#08AEEA" />
  <!-- Signal wave emanating -->
  <path d="M100 70 Q100 55 115 45 Q130 35 130 20" stroke="#08AEEA" stroke-width="1.5" fill="none" opacity="0.3" />
  <path d="M100 70 Q100 50 85 40 Q70 30 70 15" stroke="#08AEEA" stroke-width="1.5" fill="none" opacity="0.3" />
  <!-- Dot separators (stylized) -->
  <circle cx="100" cy="100" r="4" fill="#FFC107" />
  <!-- Subtitle dots and dashes for "MGIS" -->
  <!-- M=-- G=--. I=.. S=... -->
  <g fill="#08AEEA" opacity="0.4">
    <rect x="20" y="140" width="18" height="6" rx="3" />
    <rect x="42" y="140" width="18" height="6" rx="3" />
    <!-- G -->
    <rect x="68" y="140" width="18" height="6" rx="3" />
    <rect x="90" y="140" width="18" height="6" rx="3" />
    <circle cx="114" cy="143" r="3" />
    <!-- I -->
    <circle cx="126" cy="143" r="3" />
    <circle cx="136" cy="143" r="3" />
    <!-- S -->
    <circle cx="150" cy="143" r="3" />
    <circle cx="160" cy="143" r="3" />
    <circle cx="170" cy="143" r="3" />
  </g>
</svg>
