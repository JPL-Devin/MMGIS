  <g stroke="#D4C5A9" stroke-width="1.5" fill="none">
    <path d="M10 30 Q50 30 70 30 Q85 30 85 55 Q85 80 70 80 Q50 80 50 80 L190 80" />
    <path d="M10 45 Q55 45 70 45 Q100 45 100 55 Q100 65 70 65 Q55 65 55 65 L190 65" />
    <path d="M10 95 L100 95 Q120 95 135 110 Q145 130 135 145 Q120 155 100 155 L10 155" />
    <path d="M10 110 L110 110 Q125 110 130 120 Q135 135 130 140 Q125 145 110 145 L10 145" />
    <path d="M10 170 L190 170" />
    <path d="M10 185 L190 185" />
  </g>
  <!-- Stones -->
  <ellipse cx="78" cy="55" rx="18" ry="22" fill="#8D8D8D" />
  <ellipse cx="78" cy="52" rx="16" ry="18" fill="#9E9E9E" />
  <ellipse cx="120" cy="128" rx="22" ry="18" fill="#757575" />
