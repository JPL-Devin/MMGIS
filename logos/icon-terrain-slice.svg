<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- 3D terrain slice / cross-section — isometric cut-away -->
  <!-- Top surface (grass) -->
  <path d="M20 80 L100 40 L180 80 L100 120 Z" fill="#66BB6A" />
  <!-- Terrain profile on top -->
  <path d="M20 80 L40 70 L55 75 L70 55 L85 60 L100 40 L115 50 L130 45 L145 55 L160 60 L180 80 L100 120 Z" fill="#43A047" />
  <!-- Front face (soil layers) -->
  <path d="M20 80 L100 120 L100 190 L20 150 Z" fill="#8D6E63" />
  <path d="M20 100 L100 140 L100 150 L20 110 Z" fill="#A1887F" opacity="0.5" />
  <path d="M20 120 L100 160 L100 170 L20 130 Z" fill="#795548" opacity="0.5" />
  <!-- Side face -->
  <path d="M100 120 L180 80 L180 150 L100 190 Z" fill="#6D4C41" />
  <path d="M100 140 L180 100 L180 110 L100 150 Z" fill="#8D6E63" opacity="0.5" />
  <path d="M100 160 L180 120 L180 130 L100 170 Z" fill="#5D4037" opacity="0.5" />
  <!-- Fossil in cross section -->
  <circle cx="60" cy="115" r="5" stroke="#D7CCC8" stroke-width="1" fill="none" opacity="0.5" />
  <!-- Water table line -->
  <path d="M25 135 L95 175" stroke="#42A5F5" stroke-width="1" stroke-dasharray="3 2" opacity="0.6" />
</svg>
