<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Supernova explosion — radial burst of color and energy -->
  <circle cx="100" cy="100" r="98" fill="#0A0A1A" />
  <!-- Shockwave rings -->
  <circle cx="100" cy="100" r="85" stroke="#6C63FF" stroke-width="1" fill="none" opacity="0.1" />
  <circle cx="100" cy="100" r="65" stroke="#08AEEA" stroke-width="1.5" fill="none" opacity="0.15" />
  <circle cx="100" cy="100" r="45" stroke="#2ECC71" stroke-width="2" fill="none" opacity="0.2" />
  <!-- Radial jets -->
  <g stroke-linecap="round">
    <line x1="100" y1="100" x2="100" y2="8" stroke="#FFC107" stroke-width="3" opacity="0.5" />
    <line x1="100" y1="100" x2="165" y2="25" stroke="#FF6B35" stroke-width="2" opacity="0.4" />
    <line x1="100" y1="100" x2="192" y2="100" stroke="#E91E63" stroke-width="3" opacity="0.5" />
    <line x1="100" y1="100" x2="165" y2="175" stroke="#6C63FF" stroke-width="2" opacity="0.4" />
    <line x1="100" y1="100" x2="100" y2="192" stroke="#08AEEA" stroke-width="3" opacity="0.5" />
    <line x1="100" y1="100" x2="35" y2="175" stroke="#2ECC71" stroke-width="2" opacity="0.4" />
    <line x1="100" y1="100" x2="8" y2="100" stroke="#FFC107" stroke-width="3" opacity="0.5" />
    <line x1="100" y1="100" x2="35" y2="25" stroke="#E74C3C" stroke-width="2" opacity="0.4" />
  </g>
  <!-- Nebula cloud fragments -->
  <circle cx="60" cy="50" r="15" fill="#6C63FF" opacity="0.08" />
  <circle cx="145" cy="55" r="12" fill="#E91E63" opacity="0.06" />
  <circle cx="55" cy="140" r="18" fill="#08AEEA" opacity="0.07" />
  <circle cx="150" cy="145" r="14" fill="#2ECC71" opacity="0.06" />
  <!-- Core -->
  <circle cx="100" cy="100" r="18" fill="#FFC107" opacity="0.3" />
  <circle cx="100" cy="100" r="10" fill="#FFC107" opacity="0.6" />
  <circle cx="100" cy="100" r="5" fill="white" opacity="0.9" />
</svg>
