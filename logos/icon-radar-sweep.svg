<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Radar display -->
  <circle cx="100" cy="100" r="90" stroke="#2ECC71" stroke-width="1" fill="#0a1a0a" />
  <circle cx="100" cy="100" r="65" stroke="#2ECC71" stroke-width="0.5" fill="none" opacity="0.4" />
  <circle cx="100" cy="100" r="40" stroke="#2ECC71" stroke-width="0.5" fill="none" opacity="0.4" />
  <!-- Cross lines -->
  <line x1="10" y1="100" x2="190" y2="100" stroke="#2ECC71" stroke-width="0.5" opacity="0.3" />
  <line x1="100" y1="10" x2="100" y2="190" stroke="#2ECC71" stroke-width="0.5" opacity="0.3" />
  <!-- Sweep area -->
  <path d="M100 100 L100 10 A90 90 0 0 1 163.6 36.4 Z" fill="#2ECC71" opacity="0.15" />
  <!-- Sweep line -->
  <line x1="100" y1="100" x2="163.6" y2="36.4" stroke="#2ECC71" stroke-width="2" />
  <!-- Blips -->
  <circle cx="130" cy="65" r="4" fill="#2ECC71" opacity="0.8" />
  <circle cx="75" cy="130" r="3" fill="#2ECC71" opacity="0.5" />
  <circle cx="140" cy="110" r="3" fill="#2ECC71" opacity="0.6" />
  <circle cx="60" cy="75" r="2.5" fill="#2ECC71" opacity="0.4" />
  <!-- Center -->
  <circle cx="100" cy="100" r="3" fill="#2ECC71" />
</svg>
