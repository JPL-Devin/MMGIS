  <circle cx="65" cy="130" r="8" fill="#E91E63" opacity="0.7" />
  <circle cx="80" cy="140" r="5" fill="#E91E63" opacity="0.7" />
  <circle cx="95" cy="105" r="10" fill="#9C27B0" opacity="0.7" />
  <circle cx="110" cy="85" r="7" fill="#9C27B0" opacity="0.7" />
  <circle cx="125" cy="95" r="6" fill="#9C27B0" opacity="0.7" />
  <circle cx="140" cy="60" r="9" fill="#673AB7" opacity="0.7" />
  <circle cx="155" cy="70" r="5" fill="#673AB7" opacity="0.7" />
  <circle cx="170" cy="35" r="8" fill="#673AB7" opacity="0.7" />
  <circle cx="60" cy="160" r="4" fill="#E91E63" opacity="0.5" />
  <circle cx="130" cy="75" r="4" fill="#9C27B0" opacity="0.5" />
