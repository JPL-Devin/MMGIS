<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Meteor shower streaking across dark sky over terrain -->
  <rect width="200" height="200" fill="#0F0F2E" rx="5" />
  <!-- Meteors with glowing trails -->
  <g stroke-linecap="round">
    <line x1="150" y1="15" x2="95" y2="70" stroke="#FFC107" stroke-width="3" />
    <line x1="155" y1="12" x2="140" y2="28" stroke="white" stroke-width="1.5" opacity="0.8" />
    <line x1="180" y1="30" x2="145" y2="65" stroke="#FF6B35" stroke-width="2" opacity="0.7" />
    <line x1="185" y1="28" x2="175" y2="38" stroke="white" stroke-width="1" opacity="0.6" />
    <line x1="120" y1="5" x2="85" y2="40" stroke="#FFC107" stroke-width="1.5" opacity="0.5" />
    <line x1="170" y1="50" x2="150" y2="70" stroke="#FF6B35" stroke-width="1" opacity="0.4" />
    <line x1="90" y1="20" x2="70" y2="40" stroke="#FFC107" stroke-width="1" opacity="0.3" />
  </g>
  <!-- Impact glow -->
  <circle cx="95" cy="70" r="8" fill="#FFC107" opacity="0.3" />
  <circle cx="95" cy="70" r="4" fill="#FFC107" opacity="0.5" />
  <!-- Terrain silhouette -->
  <path d="M0 150 L25 130 L55 140 L80 120 L100 135 L130 115 L155 125 L180 110 L200 120 L200 200 L0 200 Z" fill="#1A1A2E" />
  <!-- Stars -->
  <circle cx="20" cy="25" r="1" fill="white" opacity="0.6" />
  <circle cx="50" cy="60" r="1.5" fill="white" opacity="0.5" />
  <circle cx="30" cy="90" r="1" fill="white" opacity="0.4" />
  <circle cx="190" cy="85" r="1" fill="white" opacity="0.3" />
</svg>
