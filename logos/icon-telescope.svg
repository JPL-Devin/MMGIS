<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Telescope body -->
  <rect x="60" y="55" width="100" height="25" rx="4" fill="#1B2838" transform="rotate(-30 110 67)" />
  <rect x="45" y="50" width="30" height="35" rx="6" fill="#2C3E50" transform="rotate(-30 60 67)" />
  <!-- Lens -->
  <circle cx="147" cy="42" r="14" stroke="#08AEEA" stroke-width="3" fill="#1B2838" />
  <circle cx="147" cy="42" r="6" fill="#08AEEA" opacity="0.3" />
  <!-- Tripod -->
  <line x1="80" y1="100" x2="60" y2="180" stroke="#2C3E50" stroke-width="3" stroke-linecap="round" />
  <line x1="80" y1="100" x2="100" y2="180" stroke="#2C3E50" stroke-width="3" stroke-linecap="round" />
  <line x1="80" y1="100" x2="140" y2="175" stroke="#2C3E50" stroke-width="3" stroke-linecap="round" />
  <!-- Stars -->
  <circle cx="170" cy="20" r="2" fill="#FFC107" />
  <circle cx="185" cy="35" r="1.5" fill="#FFC107" />
  <circle cx="25" cy="25" r="2" fill="#FFC107" />
  <circle cx="40" cy="15" r="1" fill="#FFC107" />
  <circle cx="155" cy="10" r="1" fill="#FFC107" />
</svg>
