<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Pixel/grid M in a rounded square -->
  <rect x="15" y="15" width="170" height="170" rx="20" stroke="#8BC34A" stroke-width="3" fill="none" />
  <!-- Grid-based M using small squares -->
  <g fill="#8BC34A">
    <!-- Left column -->
    <rect x="40" y="45" width="18" height="18" rx="2" />
    <rect x="40" y="68" width="18" height="18" rx="2" />
    <rect x="40" y="91" width="18" height="18" rx="2" />
    <rect x="40" y="114" width="18" height="18" rx="2" />
    <rect x="40" y="137" width="18" height="18" rx="2" />
    <!-- Left-inner diagonal -->
    <rect x="63" y="55" width="18" height="18" rx="2" opacity="0.7" />
    <rect x="63" y="78" width="18" height="18" rx="2" opacity="0.5" />
    <!-- Center -->
    <rect x="86" y="68" width="18" height="18" rx="2" opacity="0.6" />
    <rect x="86" y="91" width="18" height="18" rx="2" opacity="0.4" />
    <!-- Right-inner diagonal -->
    <rect x="109" y="55" width="18" height="18" rx="2" opacity="0.7" />
    <rect x="109" y="78" width="18" height="18" rx="2" opacity="0.5" />
    <!-- Right column -->
    <rect x="132" y="45" width="18" height="18" rx="2" />
    <rect x="132" y="68" width="18" height="18" rx="2" />
    <rect x="132" y="91" width="18" height="18" rx="2" />
    <rect x="132" y="114" width="18" height="18" rx="2" />
    <rect x="132" y="137" width="18" height="18" rx="2" />
  </g>
</svg>
