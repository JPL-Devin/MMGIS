<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Star-forming nebula — pillars of creation inspired -->
  <rect width="200" height="200" fill="#0A0A1A" rx="5" />
  <!-- Nebula gas clouds -->
  <ellipse cx="70" cy="100" rx="40" ry="70" fill="#4A148C" opacity="0.2" />
  <ellipse cx="130" cy="95" rx="45" ry="65" fill="#880E4F" opacity="0.15" />
  <ellipse cx="100" cy="110" rx="50" ry="55" fill="#1A237E" opacity="0.2" />
  <!-- Pillar structures -->
  <path d="M55 180 Q50 140 48 110 Q45 80 55 50 Q65 35 70 45 Q72 60 68 90 Q65 120 70 180" fill="#311B92" opacity="0.5" />
  <path d="M95 180 Q92 150 88 120 Q85 90 90 60 Q95 40 100 35 Q105 40 110 60 Q115 90 112 120 Q108 150 105 180" fill="#4A148C" opacity="0.6" />
  <path d="M130 180 Q128 145 132 115 Q135 85 140 60 Q143 50 148 55 Q152 70 150 100 Q148 135 145 180" fill="#311B92" opacity="0.45" />
  <!-- Bright edges (ionization fronts) -->
  <path d="M48 110 Q45 80 55 50 Q65 35 70 45" stroke="#FF6F00" stroke-width="1" fill="none" opacity="0.4" />
  <path d="M88 120 Q85 90 90 60 Q95 40 100 35 Q105 40 110 60" stroke="#FFB300" stroke-width="1.5" fill="none" opacity="0.5" />
  <path d="M132 115 Q135 85 140 60 Q143 50 148 55" stroke="#FF6F00" stroke-width="1" fill="none" opacity="0.35" />
  <!-- New stars being born -->
  <circle cx="100" cy="55" r="3" fill="#FFD54F" opacity="0.8" />
  <circle cx="100" cy="55" r="6" fill="#FFD54F" opacity="0.15" />
  <circle cx="65" cy="48" r="2" fill="#FFD54F" opacity="0.5" />
  <circle cx="142" cy="58" r="2" fill="#FFD54F" opacity="0.45" />
  <!-- Background stars -->
  <circle cx="20" cy="20" r="1" fill="white" opacity="0.6" />
  <circle cx="180" cy="25" r="1" fill="white" opacity="0.5" />
  <circle cx="175" cy="170" r="1.5" fill="white" opacity="0.4" />
  <circle cx="15" cy="155" r="1" fill="white" opacity="0.3" />
</svg>
